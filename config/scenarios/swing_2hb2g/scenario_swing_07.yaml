difficulty: hard

design:
  pool_options:
    I1: [I1o1, I1o4]
    I2: [I2o3, I2o4]
    I3: [I3o1, I3o3]
    I4: [I4o2, I4o3]
    I5: [I5o1]
  swing:
    seesaw_issue: I1
    swing_margin_band: [2, 8]
    comfort_min: 12
    hb_seesaw_favorite: { skydrop: I1o1, city_transport: I1o4 }
    swing_deal_counts: { skydrop: 5, city_transport: 4 }

project:
  name: "School-Zone Delivery Safeguards"
  shared_description: |
    The parties are deciding whether to authorize a school-zone delivery service with strict public safeguards. The agreement must settle five issues governing the school-zone service. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
    - id: skydrop
      display_name: "SkyDrop Logistics"
    - id: city_transport
      display_name: "Chicago Department of Transportation"
    - id: privacy_coalition
      display_name: "Digital Rights and Neighborhood Coalition"
    - id: couriers_guild
      display_name: "Chicago Couriers' Guild"
    - id: aviation_safety
      display_name: "Civil Aviation Safety Board"

issues:
  - id: I1
    name: "Deployment Footprint"
    description: |
      Where and how broadly the school-zone service will launch before any expansion.
    options:
      - { id: I1o1, description: "Modular structure of separable components" }
      - { id: I1o2, description: "Pilot-first design with conditional expansion" }
      - { id: I1o3, description: "Milestone-based commitments released in stages" }
      - { id: I1o4, description: "Back-loaded timeline with deferred commitments" }
  - id: I2
    name: "Operating Economics"
    description: |
      How the school-zone service will divide fees, revenue exposure, and operating risk.
    options:
      - { id: I2o1, description: "Phased rollout with scheduled checkpoints" }
      - { id: I2o2, description: "Modular structure of separable components" }
      - { id: I2o3, description: "Performance benchmarks with defined trigger points" }
      - { id: I2o4, description: "Front-loaded timeline with early commitments" }
  - id: I3
    name: "Workforce Transition"
    description: |
      How the school-zone service handles labor standards, retraining, and affected workers.
    options:
      - { id: I3o1, description: "Standardized baseline terms with fixed criteria" }
      - { id: I3o2, description: "Front-loaded timeline with early commitments" }
      - { id: I3o3, description: "Consolidated administration under unified terms" }
      - { id: I3o4, description: "Phased rollout with scheduled checkpoints" }
  - id: I4
    name: "Oversight and Data Rules"
    description: |
      What audit, data, and transparency obligations govern the school-zone service.
    options:
      - { id: I4o1, description: "Modular structure of separable components" }
      - { id: I4o2, description: "Standardized baseline terms with fixed criteria" }
      - { id: I4o3, description: "Back-loaded timeline with deferred commitments" }
      - { id: I4o4, description: "Consolidated administration under unified terms" }
  - id: I5
    name: "Community Access"
    description: |
      How neighborhoods receive benefits, recourse, and access from the school-zone service.
    options:
      - { id: I5o1, description: "Pilot-first design with conditional expansion" }
      - { id: I5o2, description: "Consolidated administration under unified terms" }
      - { id: I5o3, description: "Phased rollout with scheduled checkpoints" }
      - { id: I5o4, description: "Periodic review with built-in adjustment windows" }

agents:
  - id: skydrop
    agent_type: hard_bargainer
    min_threshold: 63
    goal_description: |
      You represent SkyDrop Logistics. You want a school-zone delivery service with strict public safeguards approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
    priority_description: |
      Your top priority is I5o2 ("Consolidated administration under unified terms") on Community Access: it is worth clearly more to you than any other single option on the table.
      Your second priority is I1o1 ("Modular structure of separable components") on Deployment Footprint — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I2o4, I3o3, I4o2, but none of them is worth a war: workable alternatives there cost you only a modest amount.
    priority_narrative: |
      - Issue I1 (max score 25): I1o1(25), I1o2(0), I1o3(0), I1o4(10)
      - Issue I2 (max score 13): I2o1(3), I2o2(0), I2o3(12), I2o4(13)
      - Issue I3 (max score 10): I3o1(9), I3o2(1), I3o3(10), I3o4(1)
      - Issue I4 (max score 10): I4o1(3), I4o2(10), I4o3(8), I4o4(3)
      - Issue I5 (max score 42): I5o1(26), I5o2(42), I5o3(1), I5o4(0)
    issue_max_scores: { I1: 25, I2: 13, I3: 10, I4: 10, I5: 42 }
    scores:
      I1: { I1o1: 25, I1o2: 0, I1o3: 0, I1o4: 10 }
      I2: { I2o1: 3, I2o2: 0, I2o3: 12, I2o4: 13 }
      I3: { I3o1: 9, I3o2: 1, I3o3: 10, I3o4: 1 }
      I4: { I4o1: 3, I4o2: 10, I4o3: 8, I4o4: 3 }
      I5: { I5o1: 26, I5o2: 42, I5o3: 1, I5o4: 0 }
    preference_examples_about_others: |
      City Transport will press for public control, fiscal defensibility, and operational accountability. It has signaled that its single biggest prize is I5o3 ("Phased rollout with scheduled checkpoints") on Community Access, and that it also strongly prefers I1o4 ("Back-loaded timeline with deferred commitments") on Deployment Footprint. Privacy Coalition will prioritize data limits, community safeguards, and cautious rollout. It has signaled that it cares most about I3o3 ("Consolidated administration under unified terms") on Workforce Transition, and that it also values I4o3 ("Back-loaded timeline with deferred commitments") on Oversight and Data Rules. Couriers Guild will push for job protections, retraining, and worker recourse. It has signaled that it cares most about I2o3 ("Performance benchmarks with defined trigger points") on Operating Economics, and that it also values I4o3 ("Back-loaded timeline with deferred commitments") on Oversight and Data Rules. Aviation Safety will prioritize conservative operating envelopes, regulator visibility, and incident-response authority. It has signaled that it cares most about I1o2 ("Pilot-first design with conditional expansion") on Deployment Footprint, and that I5o1 ("Pilot-first design with conditional expansion") on Community Access is the direction it can support on that issue.

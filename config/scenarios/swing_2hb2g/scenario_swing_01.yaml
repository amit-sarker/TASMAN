difficulty: hard

design:
  pool_options:
    I1: [I1o1, I1o2]
    I2: [I2o1, I2o4]
    I3: [I3o1, I3o3]
    I4: [I4o4]
    I5: [I5o2, I5o3]
  swing:
    seesaw_issue: I2
    swing_margin_band: [2, 8]
    comfort_min: 12
    hb_seesaw_favorite: { skydrop: I2o1, city_transport: I2o4 }
    swing_deal_counts: { skydrop: 5, city_transport: 5 }

project:
  name: "Microhub Permit Exchange"
  shared_description: |
    The parties are deciding whether to authorize a curbside freight microhub permit program. The agreement must settle five issues governing the freight microhubs. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
    - id: skydrop
      display_name: "SkyDrop Logistics"
    - id: city_transport
      display_name: "Chicago Department of Transportation"
    - id: privacy_coalition
      display_name: "Digital Rights and Neighborhood Coalition"
    - id: couriers_guild
      display_name: "Chicago Couriers' Guild"
    - id: aviation_safety
      display_name: "Civil Aviation Safety Board"

issues:
  - id: I1
    name: "Community Access"
    description: |
      How neighborhoods receive benefits, recourse, and access from the freight microhubs.
    options:
      - { id: I1o1, description: "Milestone-based commitments released in stages" }
      - { id: I1o2, description: "Front-loaded timeline with early commitments" }
      - { id: I1o3, description: "Outcome-based design with measurable targets" }
      - { id: I1o4, description: "Performance benchmarks with defined trigger points" }
  - id: I2
    name: "Workforce Transition"
    description: |
      How the freight microhubs handles labor standards, retraining, and affected workers.
    options:
      - { id: I2o1, description: "Pilot-first design with conditional expansion" }
      - { id: I2o2, description: "Performance benchmarks with defined trigger points" }
      - { id: I2o3, description: "Front-loaded timeline with early commitments" }
      - { id: I2o4, description: "Back-loaded timeline with deferred commitments" }
  - id: I3
    name: "Deployment Footprint"
    description: |
      Where and how broadly the freight microhubs will launch before any expansion.
    options:
      - { id: I3o1, description: "Standardized baseline terms with fixed criteria" }
      - { id: I3o2, description: "Outcome-based design with measurable targets" }
      - { id: I3o3, description: "Back-loaded timeline with deferred commitments" }
      - { id: I3o4, description: "Tiered requirements with graduated thresholds" }
  - id: I4
    name: "Environmental and Noise Controls"
    description: |
      How the freight microhubs manages noise, emissions, and environmental accountability.
    options:
      - { id: I4o1, description: "Pilot-first design with conditional expansion" }
      - { id: I4o2, description: "Phased rollout with scheduled checkpoints" }
      - { id: I4o3, description: "Standardized baseline terms with fixed criteria" }
      - { id: I4o4, description: "Periodic review with built-in adjustment windows" }
  - id: I5
    name: "Operating Economics"
    description: |
      How the freight microhubs will divide fees, revenue exposure, and operating risk.
    options:
      - { id: I5o1, description: "Outcome-based design with measurable targets" }
      - { id: I5o2, description: "Performance benchmarks with defined trigger points" }
      - { id: I5o3, description: "Tiered requirements with graduated thresholds" }
      - { id: I5o4, description: "Milestone-based commitments released in stages" }

agents:
  - id: skydrop
    agent_type: hard_bargainer
    min_threshold: 62
    goal_description: |
      You represent SkyDrop Logistics. You want a curbside freight microhub permit program approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
    priority_description: |
      Your top priority is I4o3 ("Standardized baseline terms with fixed criteria") on Environmental and Noise Controls: it is worth clearly more to you than any other single option on the table.
      Your second priority is I2o1 ("Pilot-first design with conditional expansion") on Workforce Transition — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I1o1, I3o1, I5o2, but none of them is worth a war: workable alternatives there cost you only a modest amount.
    priority_narrative: |
      - Issue I1 (max score 10): I1o1(10), I1o2(10), I1o3(2), I1o4(1)
      - Issue I2 (max score 26): I2o1(26), I2o2(2), I2o3(1), I2o4(11)
      - Issue I3 (max score 10): I3o1(10), I3o2(0), I3o3(8), I3o4(1)
      - Issue I4 (max score 44): I4o1(3), I4o2(0), I4o3(44), I4o4(27)
      - Issue I5 (max score 10): I5o1(0), I5o2(10), I5o3(10), I5o4(1)
    issue_max_scores: { I1: 10, I2: 26, I3: 10, I4: 44, I5: 10 }
    scores:
      I1: { I1o1: 10, I1o2: 10, I1o3: 2, I1o4: 1 }
      I2: { I2o1: 26, I2o2: 2, I2o3: 1, I2o4: 11 }
      I3: { I3o1: 10, I3o2: 0, I3o3: 8, I3o4: 1 }
      I4: { I4o1: 3, I4o2: 0, I4o3: 44, I4o4: 27 }
      I5: { I5o1: 0, I5o2: 10, I5o3: 10, I5o4: 1 }
    preference_examples_about_others: |
      City Transport will press for public control, fiscal defensibility, and operational accountability. It has signaled that its single biggest prize is I4o2 ("Phased rollout with scheduled checkpoints") on Environmental and Noise Controls, and that it also strongly prefers I2o4 ("Back-loaded timeline with deferred commitments") on Workforce Transition. Privacy Coalition will prioritize data limits, community safeguards, and cautious rollout. It has signaled that it cares most about I5o3 ("Tiered requirements with graduated thresholds") on Operating Economics, and that it also values I3o3 ("Back-loaded timeline with deferred commitments") on Deployment Footprint. Couriers Guild will push for job protections, retraining, and worker recourse. It has signaled that it cares most about I1o1 ("Milestone-based commitments released in stages") on Community Access, and that it also values I3o3 ("Back-loaded timeline with deferred commitments") on Deployment Footprint. Aviation Safety will prioritize conservative operating envelopes, regulator visibility, and incident-response authority. It has signaled that it cares most about I5o4 ("Milestone-based commitments released in stages") on Operating Economics, and that I4o4 ("Periodic review with built-in adjustment windows") on Environmental and Noise Controls is the direction it can support on that issue.

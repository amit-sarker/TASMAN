difficulty: hard

design:
  pool_options:
    I1: [I1o1, I1o2]
    I2: [I2o1, I2o2]
    I3: [I3o2, I3o3]
    I4: [I4o3, I4o4]
    I5: [I5o1]
  swing:
    seesaw_issue: I3
    swing_margin_band: [2, 8]
    comfort_min: 12
    hb_seesaw_favorite: { skydrop: I3o2, city_transport: I3o3 }
    swing_deal_counts: { skydrop: 5, city_transport: 5 }

project:
  name: "Hospital Campus Shuttle"
  shared_description: |
    The parties are deciding whether to authorize a hospital-campus aerial shuttle for sterile and urgent supplies. The agreement must settle five issues governing the hospital shuttle. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
    - id: skydrop
      display_name: "SkyDrop Logistics"
    - id: city_transport
      display_name: "Chicago Department of Transportation"
    - id: privacy_coalition
      display_name: "Digital Rights and Neighborhood Coalition"
    - id: couriers_guild
      display_name: "Chicago Couriers' Guild"
    - id: aviation_safety
      display_name: "Civil Aviation Safety Board"

issues:
  - id: I1
    name: "Environmental and Noise Controls"
    description: |
      How the hospital shuttle manages noise, emissions, and environmental accountability.
    options:
      - { id: I1o1, description: "Consolidated administration under unified terms" }
      - { id: I1o2, description: "Tiered requirements with graduated thresholds" }
      - { id: I1o3, description: "Milestone-based commitments released in stages" }
      - { id: I1o4, description: "Modular structure of separable components" }
  - id: I2
    name: "Safety Operating Envelope"
    description: |
      What operating constraints and safety checks apply while the hospital shuttle runs.
    options:
      - { id: I2o1, description: "Milestone-based commitments released in stages" }
      - { id: I2o2, description: "Periodic review with built-in adjustment windows" }
      - { id: I2o3, description: "Phased rollout with scheduled checkpoints" }
      - { id: I2o4, description: "Standardized baseline terms with fixed criteria" }
  - id: I3
    name: "Workforce Transition"
    description: |
      How the hospital shuttle handles labor standards, retraining, and affected workers.
    options:
      - { id: I3o1, description: "Outcome-based design with measurable targets" }
      - { id: I3o2, description: "Periodic review with built-in adjustment windows" }
      - { id: I3o3, description: "Tiered requirements with graduated thresholds" }
      - { id: I3o4, description: "Modular structure of separable components" }
  - id: I4
    name: "Community Access"
    description: |
      How neighborhoods receive benefits, recourse, and access from the hospital shuttle.
    options:
      - { id: I4o1, description: "Periodic review with built-in adjustment windows" }
      - { id: I4o2, description: "Modular structure of separable components" }
      - { id: I4o3, description: "Performance benchmarks with defined trigger points" }
      - { id: I4o4, description: "Front-loaded timeline with early commitments" }
  - id: I5
    name: "Operating Economics"
    description: |
      How the hospital shuttle will divide fees, revenue exposure, and operating risk.
    options:
      - { id: I5o1, description: "Phased rollout with scheduled checkpoints" }
      - { id: I5o2, description: "Tiered requirements with graduated thresholds" }
      - { id: I5o3, description: "Milestone-based commitments released in stages" }
      - { id: I5o4, description: "Consolidated administration under unified terms" }

agents:
  - id: skydrop
    agent_type: hard_bargainer
    min_threshold: 60
    goal_description: |
      You represent SkyDrop Logistics. You want a hospital-campus aerial shuttle for sterile and urgent supplies approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
    priority_description: |
      Your top priority is I5o4 ("Consolidated administration under unified terms") on Operating Economics: it is worth clearly more to you than any other single option on the table.
      Your second priority is I3o2 ("Periodic review with built-in adjustment windows") on Workforce Transition — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I1o2, I2o2, I4o4, but none of them is worth a war: workable alternatives there cost you only a modest amount.
    priority_narrative: |
      - Issue I1 (max score 10): I1o1(9), I1o2(10), I1o3(2), I1o4(2)
      - Issue I2 (max score 10): I2o1(9), I2o2(10), I2o3(0), I2o4(3)
      - Issue I3 (max score 26): I3o1(0), I3o2(26), I3o3(10), I3o4(1)
      - Issue I4 (max score 10): I4o1(0), I4o2(1), I4o3(8), I4o4(10)
      - Issue I5 (max score 44): I5o1(26), I5o2(2), I5o3(0), I5o4(44)
    issue_max_scores: { I1: 10, I2: 10, I3: 26, I4: 10, I5: 44 }
    scores:
      I1: { I1o1: 9, I1o2: 10, I1o3: 2, I1o4: 2 }
      I2: { I2o1: 9, I2o2: 10, I2o3: 0, I2o4: 3 }
      I3: { I3o1: 0, I3o2: 26, I3o3: 10, I3o4: 1 }
      I4: { I4o1: 0, I4o2: 1, I4o3: 8, I4o4: 10 }
      I5: { I5o1: 26, I5o2: 2, I5o3: 0, I5o4: 44 }
    preference_examples_about_others: |
      City Transport will press for public control, fiscal defensibility, and operational accountability. It has signaled that its single biggest prize is I5o3 ("Milestone-based commitments released in stages") on Operating Economics, and that it also strongly prefers I3o3 ("Tiered requirements with graduated thresholds") on Workforce Transition. Privacy Coalition will prioritize data limits, community safeguards, and cautious rollout. It has signaled that it cares most about I1o1 ("Consolidated administration under unified terms") on Environmental and Noise Controls, and that it also values I2o1 ("Milestone-based commitments released in stages") on Safety Operating Envelope. Couriers Guild will push for job protections, retraining, and worker recourse. It has signaled that it cares most about I4o4 ("Front-loaded timeline with early commitments") on Community Access, and that it also values I2o1 ("Milestone-based commitments released in stages") on Safety Operating Envelope. Aviation Safety will prioritize conservative operating envelopes, regulator visibility, and incident-response authority. It has signaled that it cares most about I4o1 ("Periodic review with built-in adjustment windows") on Community Access, and that I5o1 ("Phased rollout with scheduled checkpoints") on Operating Economics is the direction it can support on that issue.

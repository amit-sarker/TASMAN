  - id: couriers_guild
    agent_type: general
    min_threshold: 66
    goal_description: |
      You represent Chicago Couriers' Guild. You want a lakefront park service route for maintenance and visitor support to protect workers affected by automation, route changes, and contracting shifts while preserving enough real work to make the transition credible.
    priority_description: |
      Your top priority is I4o4 ("Periodic review with built-in adjustment windows") on Deployment Footprint: it is worth clearly more to you than any other single option on the table.
      Your second priority is I1o3 ("Performance benchmarks with defined trigger points") on Workforce Transition — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I2o1, I5o1, but none of them is worth a war: workable alternatives there cost you only a modest amount.

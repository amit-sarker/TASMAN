    min_threshold: 67
    goal_description: |
      You represent the Civil Aviation Safety Board. You want a lakefront park service route for maintenance and visitor support to include credible oversight, controlled operating conditions, clear incident-response authority, and safety assurances the public can trust. You hold this program to exacting standards and expect any package to reflect them in full.
    priority_description: |
      Your top priority is I5o3 ("Back-loaded timeline with deferred commitments") on Safety Operating Envelope: it is worth clearly more to you than any other single option on the table.

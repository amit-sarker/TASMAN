  - id: privacy_coalition
    agent_type: general
    min_threshold: 66
    goal_description: |
      You represent Digital Rights and Neighborhood Coalition. You want a lakefront park service route for maintenance and visitor support to protect residents through strong data limits, public-interest oversight, community recourse, and a cautious footprint.
    priority_description: |
      Your top priority is I5o2 ("Performance benchmarks with defined trigger points") on Safety Operating Envelope: it is worth clearly more to you than any other single option on the table.
      Your second priority is I1o3 ("Performance benchmarks with defined trigger points") on Workforce Transition — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I2o3, I4o3, but none of them is worth a war: workable alternatives there cost you only a modest amount.
      On Operating Economics, only I3o4 ("Periodic review with built-in adjustment windows") really works for you: the other directions there give you almost nothing.

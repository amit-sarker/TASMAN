difficulty: hard

design:
  pool_options:
    I1: [I1o3, I1o4]
    I2: [I2o1, I2o3]
    I3: [I3o4]
    I4: [I4o3, I4o4]
    I5: [I5o1, I5o2]
  swing:
    seesaw_issue: I2
    swing_margin_band: [2, 8]
    comfort_min: 12
    hb_seesaw_favorite: { skydrop: I2o3, city_transport: I2o1 }
    swing_deal_counts: { skydrop: 5, city_transport: 5 }

project:
  name: "Lakefront Service Route"
  shared_description: |
    The parties are deciding whether to authorize a lakefront park service route for maintenance and visitor support. The agreement must settle five issues governing the lakefront service. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
    - id: skydrop
      display_name: "SkyDrop Logistics"
    - id: city_transport
      display_name: "Chicago Department of Transportation"
    - id: privacy_coalition
      display_name: "Digital Rights and Neighborhood Coalition"
    - id: couriers_guild
      display_name: "Chicago Couriers' Guild"
    - id: aviation_safety
      display_name: "Civil Aviation Safety Board"

issues:
  - id: I1
    name: "Workforce Transition"
    description: |
      How the lakefront service handles labor standards, retraining, and affected workers.
    options:
      - { id: I1o1, description: "Periodic review with built-in adjustment windows" }
      - { id: I1o2, description: "Front-loaded timeline with early commitments" }
      - { id: I1o3, description: "Performance benchmarks with defined trigger points" }
      - { id: I1o4, description: "Modular structure of separable components" }
  - id: I2
    name: "Oversight and Data Rules"
    description: |
      What audit, data, and transparency obligations govern the lakefront service.
    options:
      - { id: I2o1, description: "Phased rollout with scheduled checkpoints" }
      - { id: I2o2, description: "Consolidated administration under unified terms" }
      - { id: I2o3, description: "Standardized baseline terms with fixed criteria" }
      - { id: I2o4, description: "Tiered requirements with graduated thresholds" }
  - id: I3
    name: "Operating Economics"
    description: |
      How the lakefront service will divide fees, revenue exposure, and operating risk.
    options:
      - { id: I3o1, description: "Phased rollout with scheduled checkpoints" }
      - { id: I3o2, description: "Back-loaded timeline with deferred commitments" }
      - { id: I3o3, description: "Milestone-based commitments released in stages" }
      - { id: I3o4, description: "Periodic review with built-in adjustment windows" }
  - id: I4
    name: "Deployment Footprint"
    description: |
      Where and how broadly the lakefront service will launch before any expansion.
    options:
      - { id: I4o1, description: "Front-loaded timeline with early commitments" }
      - { id: I4o2, description: "Tiered requirements with graduated thresholds" }
      - { id: I4o3, description: "Phased rollout with scheduled checkpoints" }
      - { id: I4o4, description: "Periodic review with built-in adjustment windows" }
  - id: I5
    name: "Safety Operating Envelope"
    description: |
      What operating constraints and safety checks apply while the lakefront service runs.
    options:
      - { id: I5o1, description: "Periodic review with built-in adjustment windows" }
      - { id: I5o2, description: "Performance benchmarks with defined trigger points" }
      - { id: I5o3, description: "Back-loaded timeline with deferred commitments" }
      - { id: I5o4, description: "Outcome-based design with measurable targets" }

agents:
  - id: skydrop
    agent_type: hard_bargainer
    min_threshold: 60
    goal_description: |
      You represent SkyDrop Logistics. You want a lakefront park service route for maintenance and visitor support approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
    priority_description: |
      Your top priority is I3o3 ("Milestone-based commitments released in stages") on Operating Economics: it is worth clearly more to you than any other single option on the table.
      Your second priority is I2o3 ("Standardized baseline terms with fixed criteria") on Oversight and Data Rules — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I1o4, I4o3, I5o2, but none of them is worth a war: workable alternatives there cost you only a modest amount.
    priority_narrative: |
      - Issue I1 (max score 10): I1o1(0), I1o2(1), I1o3(9), I1o4(10)
      - Issue I2 (max score 28): I2o1(12), I2o2(1), I2o3(28), I2o4(1)
      - Issue I3 (max score 42): I3o1(2), I3o2(0), I3o3(42), I3o4(24)
      - Issue I4 (max score 10): I4o1(0), I4o2(2), I4o3(10), I4o4(10)
      - Issue I5 (max score 10): I5o1(9), I5o2(10), I5o3(0), I5o4(3)
    issue_max_scores: { I1: 10, I2: 28, I3: 42, I4: 10, I5: 10 }
    scores:
      I1: { I1o1: 0, I1o2: 1, I1o3: 9, I1o4: 10 }
      I2: { I2o1: 12, I2o2: 1, I2o3: 28, I2o4: 1 }
      I3: { I3o1: 2, I3o2: 0, I3o3: 42, I3o4: 24 }
      I4: { I4o1: 0, I4o2: 2, I4o3: 10, I4o4: 10 }
      I5: { I5o1: 9, I5o2: 10, I5o3: 0, I5o4: 3 }
    preference_examples_about_others: |
      City Transport will press for public control, fiscal defensibility, and operational accountability. It has signaled that its single biggest prize is I3o2 ("Back-loaded timeline with deferred commitments") on Operating Economics, and that it also strongly prefers I2o1 ("Phased rollout with scheduled checkpoints") on Oversight and Data Rules. Privacy Coalition will prioritize data limits, community safeguards, and cautious rollout. It has signaled that it cares most about I5o2 ("Performance benchmarks with defined trigger points") on Safety Operating Envelope, and that it also values I1o3 ("Performance benchmarks with defined trigger points") on Workforce Transition. Couriers Guild will push for job protections, retraining, and worker recourse. It has signaled that it cares most about I4o4 ("Periodic review with built-in adjustment windows") on Deployment Footprint, and that it also values I1o3 ("Performance benchmarks with defined trigger points") on Workforce Transition. Aviation Safety will prioritize conservative operating envelopes, regulator visibility, and incident-response authority. It has signaled that it cares most about I5o3 ("Back-loaded timeline with deferred commitments") on Safety Operating Envelope, and that I3o4 ("Periodic review with built-in adjustment windows") on Operating Economics is the direction it can support on that issue.
  - id: city_transport
    agent_type: hard_bargainer
    min_threshold: 64
    goal_description: |
      You represent Chicago Department of Transportation. You want a lakefront park service route for maintenance and visitor support to be fiscally defensible, publicly accountable, and compatible with city operations rather than a private system that externalizes risk.

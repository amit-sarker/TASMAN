difficulty: hard

design:
  pool_options:
    I1: [I1o1, I1o2]
    I2: [I2o2, I2o4]
    I3: [I3o1, I3o4]
    I4: [I4o1, I4o3]
    I5: [I5o2]
  swing:
    seesaw_issue: I3
    swing_margin_band: [2, 8]
    comfort_min: 12
    hb_seesaw_favorite: { skydrop: I3o4, city_transport: I3o1 }
    swing_deal_counts: { skydrop: 5, city_transport: 5 }

project:
  name: "Warehouse Electrification Rollout"
  shared_description: |
    The parties are deciding whether to authorize an electrified warehouse and charging-yard logistics plan. The agreement must settle five issues governing the charging hubs. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
    - id: skydrop
      display_name: "SkyDrop Logistics"
    - id: city_transport
      display_name: "Chicago Department of Transportation"
    - id: privacy_coalition
      display_name: "Digital Rights and Neighborhood Coalition"
    - id: couriers_guild
      display_name: "Chicago Couriers' Guild"
    - id: aviation_safety
      display_name: "Civil Aviation Safety Board"

issues:
  - id: I1
    name: "Environmental and Noise Controls"
    description: |
      How the charging hubs manages noise, emissions, and environmental accountability.
    options:
      - { id: I1o1, description: "Performance benchmarks with defined trigger points" }
      - { id: I1o2, description: "Milestone-based commitments released in stages" }
      - { id: I1o3, description: "Front-loaded timeline with early commitments" }
      - { id: I1o4, description: "Phased rollout with scheduled checkpoints" }
  - id: I2
    name: "Community Access"
    description: |
      How neighborhoods receive benefits, recourse, and access from the charging hubs.
    options:
      - { id: I2o1, description: "Modular structure of separable components" }
      - { id: I2o2, description: "Tiered requirements with graduated thresholds" }
      - { id: I2o3, description: "Back-loaded timeline with deferred commitments" }
      - { id: I2o4, description: "Pilot-first design with conditional expansion" }
  - id: I3
    name: "Oversight and Data Rules"
    description: |
      What audit, data, and transparency obligations govern the charging hubs.
    options:
      - { id: I3o1, description: "Outcome-based design with measurable targets" }
      - { id: I3o2, description: "Standardized baseline terms with fixed criteria" }
      - { id: I3o3, description: "Back-loaded timeline with deferred commitments" }
      - { id: I3o4, description: "Tiered requirements with graduated thresholds" }
  - id: I4
    name: "Operating Economics"
    description: |
      How the charging hubs will divide fees, revenue exposure, and operating risk.
    options:
      - { id: I4o1, description: "Tiered requirements with graduated thresholds" }
      - { id: I4o2, description: "Outcome-based design with measurable targets" }
      - { id: I4o3, description: "Standardized baseline terms with fixed criteria" }
      - { id: I4o4, description: "Back-loaded timeline with deferred commitments" }
  - id: I5
    name: "Safety Operating Envelope"
    description: |
      What operating constraints and safety checks apply while the charging hubs runs.
    options:
      - { id: I5o1, description: "Outcome-based design with measurable targets" }
      - { id: I5o2, description: "Modular structure of separable components" }
      - { id: I5o3, description: "Performance benchmarks with defined trigger points" }
      - { id: I5o4, description: "Periodic review with built-in adjustment windows" }

agents:
  - id: skydrop
    agent_type: hard_bargainer
    min_threshold: 62
    goal_description: |
      You represent SkyDrop Logistics. You want an electrified warehouse and charging-yard logistics plan approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
    priority_description: |
      Your top priority is I5o3 ("Performance benchmarks with defined trigger points") on Safety Operating Envelope: it is worth clearly more to you than any other single option on the table.
      Your second priority is I3o4 ("Tiered requirements with graduated thresholds") on Oversight and Data Rules — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I1o2, I2o4, I4o1, but none of them is worth a war: workable alternatives there cost you only a modest amount.
    priority_narrative: |
      - Issue I1 (max score 11): I1o1(9), I1o2(11), I1o3(1), I1o4(0)
      - Issue I2 (max score 11): I2o1(0), I2o2(10), I2o3(3), I2o4(11)
      - Issue I3 (max score 27): I3o1(11), I3o2(0), I3o3(2), I3o4(27)
      - Issue I4 (max score 11): I4o1(11), I4o2(3), I4o3(11), I4o4(1)
      - Issue I5 (max score 40): I5o1(1), I5o2(25), I5o3(40), I5o4(0)
    issue_max_scores: { I1: 11, I2: 11, I3: 27, I4: 11, I5: 40 }
    scores:
      I1: { I1o1: 9, I1o2: 11, I1o3: 1, I1o4: 0 }
      I2: { I2o1: 0, I2o2: 10, I2o3: 3, I2o4: 11 }
      I3: { I3o1: 11, I3o2: 0, I3o3: 2, I3o4: 27 }
      I4: { I4o1: 11, I4o2: 3, I4o3: 11, I4o4: 1 }
      I5: { I5o1: 1, I5o2: 25, I5o3: 40, I5o4: 0 }
    preference_examples_about_others: |
      City Transport will press for public control, fiscal defensibility, and operational accountability. It has signaled that its single biggest prize is I5o4 ("Periodic review with built-in adjustment windows") on Safety Operating Envelope, and that it also strongly prefers I3o1 ("Outcome-based design with measurable targets") on Oversight and Data Rules. Privacy Coalition will prioritize data limits, community safeguards, and cautious rollout. It has signaled that it cares most about I4o1 ("Tiered requirements with graduated thresholds") on Operating Economics, and that it also values I1o1 ("Performance benchmarks with defined trigger points") on Environmental and Noise Controls. Couriers Guild will push for job protections, retraining, and worker recourse. It has signaled that it cares most about I2o4 ("Pilot-first design with conditional expansion") on Community Access, and that it also values I1o1 ("Performance benchmarks with defined trigger points") on Environmental and Noise Controls. Aviation Safety will prioritize conservative operating envelopes, regulator visibility, and incident-response authority. It has signaled that it cares most about I4o2 ("Outcome-based design with measurable targets") on Operating Economics, and that I5o2 ("Modular structure of separable components") on Safety Operating Envelope is the direction it can support on that issue.

difficulty: hard

design:
  pool_options:
    I1: [I1o1, I1o4]
    I2: [I2o1, I2o2]
    I3: [I3o2, I3o4]
    I4: [I4o1, I4o4]
    I5: [I5o2]
  swing:
    seesaw_issue: I3
    swing_margin_band: [2, 8]
    comfort_min: 12
    hb_seesaw_favorite: { skydrop: I3o4, city_transport: I3o2 }
    swing_deal_counts: { skydrop: 5, city_transport: 4 }

project:
  name: "University District Grid"
  shared_description: |
    The parties are deciding whether to authorize a university-district logistics grid for labs, dorms, and vendors. The agreement must settle five issues governing the campus grid. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
    - id: skydrop
      display_name: "SkyDrop Logistics"
    - id: city_transport
      display_name: "Chicago Department of Transportation"
    - id: privacy_coalition
      display_name: "Digital Rights and Neighborhood Coalition"
    - id: couriers_guild
      display_name: "Chicago Couriers' Guild"
    - id: aviation_safety
      display_name: "Civil Aviation Safety Board"

issues:
  - id: I1
    name: "Deployment Footprint"
    description: |
      Where and how broadly the campus grid will launch before any expansion.
    options:
      - { id: I1o1, description: "Outcome-based design with measurable targets" }
      - { id: I1o2, description: "Milestone-based commitments released in stages" }
      - { id: I1o3, description: "Modular structure of separable components" }
      - { id: I1o4, description: "Back-loaded timeline with deferred commitments" }
  - id: I2
    name: "Workforce Transition"
    description: |
      How the campus grid handles labor standards, retraining, and affected workers.
    options:
      - { id: I2o1, description: "Tiered requirements with graduated thresholds" }
      - { id: I2o2, description: "Phased rollout with scheduled checkpoints" }
      - { id: I2o3, description: "Performance benchmarks with defined trigger points" }
      - { id: I2o4, description: "Periodic review with built-in adjustment windows" }
  - id: I3
    name: "Safety Operating Envelope"
    description: |
      What operating constraints and safety checks apply while the campus grid runs.
    options:
      - { id: I3o1, description: "Front-loaded timeline with early commitments" }
      - { id: I3o2, description: "Phased rollout with scheduled checkpoints" }
      - { id: I3o3, description: "Modular structure of separable components" }
      - { id: I3o4, description: "Pilot-first design with conditional expansion" }
  - id: I4
    name: "Community Access"
    description: |
      How neighborhoods receive benefits, recourse, and access from the campus grid.
    options:
      - { id: I4o1, description: "Performance benchmarks with defined trigger points" }
      - { id: I4o2, description: "Outcome-based design with measurable targets" }
      - { id: I4o3, description: "Milestone-based commitments released in stages" }
      - { id: I4o4, description: "Modular structure of separable components" }
  - id: I5
    name: "Oversight and Data Rules"
    description: |
      What audit, data, and transparency obligations govern the campus grid.
    options:
      - { id: I5o1, description: "Modular structure of separable components" }
      - { id: I5o2, description: "Standardized baseline terms with fixed criteria" }
      - { id: I5o3, description: "Front-loaded timeline with early commitments" }
      - { id: I5o4, description: "Back-loaded timeline with deferred commitments" }

agents:
  - id: skydrop
    agent_type: hard_bargainer
    min_threshold: 63
    goal_description: |
      You represent SkyDrop Logistics. You want a university-district logistics grid for labs, dorms, and vendors approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
    priority_description: |
      Your top priority is I5o3 ("Front-loaded timeline with early commitments") on Oversight and Data Rules: it is worth clearly more to you than any other single option on the table.
      Your second priority is I3o4 ("Pilot-first design with conditional expansion") on Safety Operating Envelope — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I1o1, I2o1, I4o1, but none of them is worth a war: workable alternatives there cost you only a modest amount.
    priority_narrative: |
      - Issue I1 (max score 11): I1o1(11), I1o2(1), I1o3(1), I1o4(10)
      - Issue I2 (max score 11): I2o1(11), I2o2(10), I2o3(1), I2o4(1)
      - Issue I3 (max score 28): I3o1(0), I3o2(13), I3o3(2), I3o4(28)
      - Issue I4 (max score 11): I4o1(11), I4o2(0), I4o3(2), I4o4(11)
      - Issue I5 (max score 39): I5o1(1), I5o2(24), I5o3(39), I5o4(0)
    issue_max_scores: { I1: 11, I2: 11, I3: 28, I4: 11, I5: 39 }
    scores:
      I1: { I1o1: 11, I1o2: 1, I1o3: 1, I1o4: 10 }
      I2: { I2o1: 11, I2o2: 10, I2o3: 1, I2o4: 1 }
      I3: { I3o1: 0, I3o2: 13, I3o3: 2, I3o4: 28 }
      I4: { I4o1: 11, I4o2: 0, I4o3: 2, I4o4: 11 }
      I5: { I5o1: 1, I5o2: 24, I5o3: 39, I5o4: 0 }
    preference_examples_about_others: |
      City Transport will press for public control, fiscal defensibility, and operational accountability. It has signaled that its single biggest prize is I5o4 ("Back-loaded timeline with deferred commitments") on Oversight and Data Rules, and that it also strongly prefers I3o2 ("Phased rollout with scheduled checkpoints") on Safety Operating Envelope. Privacy Coalition will prioritize data limits, community safeguards, and cautious rollout. It has signaled that it cares most about I4o4 ("Modular structure of separable components") on Community Access, and that it also values I1o4 ("Back-loaded timeline with deferred commitments") on Deployment Footprint. Couriers Guild will push for job protections, retraining, and worker recourse. It has signaled that it cares most about I2o1 ("Tiered requirements with graduated thresholds") on Workforce Transition, and that it also values I1o4 ("Back-loaded timeline with deferred commitments") on Deployment Footprint. Aviation Safety will prioritize conservative operating envelopes, regulator visibility, and incident-response authority. It has signaled that it cares most about I1o2 ("Milestone-based commitments released in stages") on Deployment Footprint, and that I5o2 ("Standardized baseline terms with fixed criteria") on Oversight and Data Rules is the direction it can support on that issue.

difficulty: hard

design:
  pool_options:
    I1: [I1o1]
    I2: [I2o2, I2o3]
    I3: [I3o2, I3o4]
    I4: [I4o1, I4o2]
    I5: [I5o3, I5o4]
  swing:
    seesaw_issue: I5
    swing_margin_band: [2, 8]
    comfort_min: 12
    hb_seesaw_favorite: { skydrop: I5o3, city_transport: I5o4 }
    swing_deal_counts: { skydrop: 5, city_transport: 5 }

project:
  name: "Library Pickup Mesh"
  shared_description: |
    The parties are deciding whether to authorize a neighborhood library pickup mesh for public-service deliveries. The agreement must settle five issues governing the library pickup points. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
    - id: skydrop
      display_name: "SkyDrop Logistics"
    - id: city_transport
      display_name: "Chicago Department of Transportation"
    - id: privacy_coalition
      display_name: "Digital Rights and Neighborhood Coalition"
    - id: couriers_guild
      display_name: "Chicago Couriers' Guild"
    - id: aviation_safety
      display_name: "Civil Aviation Safety Board"

issues:
  - id: I1
    name: "Environmental and Noise Controls"
    description: |
      How the library pickup points manages noise, emissions, and environmental accountability.
    options:
      - { id: I1o1, description: "Modular structure of separable components" }
      - { id: I1o2, description: "Front-loaded timeline with early commitments" }
      - { id: I1o3, description: "Milestone-based commitments released in stages" }
      - { id: I1o4, description: "Performance benchmarks with defined trigger points" }
  - id: I2
    name: "Deployment Footprint"
    description: |
      Where and how broadly the library pickup points will launch before any expansion.
    options:
      - { id: I2o1, description: "Phased rollout with scheduled checkpoints" }
      - { id: I2o2, description: "Tiered requirements with graduated thresholds" }
      - { id: I2o3, description: "Front-loaded timeline with early commitments" }
      - { id: I2o4, description: "Pilot-first design with conditional expansion" }
  - id: I3
    name: "Operating Economics"
    description: |
      How the library pickup points will divide fees, revenue exposure, and operating risk.
    options:
      - { id: I3o1, description: "Outcome-based design with measurable targets" }
      - { id: I3o2, description: "Front-loaded timeline with early commitments" }
      - { id: I3o3, description: "Standardized baseline terms with fixed criteria" }
      - { id: I3o4, description: "Milestone-based commitments released in stages" }
  - id: I4
    name: "Oversight and Data Rules"
    description: |
      What audit, data, and transparency obligations govern the library pickup points.
    options:
      - { id: I4o1, description: "Back-loaded timeline with deferred commitments" }
      - { id: I4o2, description: "Performance benchmarks with defined trigger points" }
      - { id: I4o3, description: "Outcome-based design with measurable targets" }
      - { id: I4o4, description: "Modular structure of separable components" }
  - id: I5
    name: "Safety Operating Envelope"
    description: |
      What operating constraints and safety checks apply while the library pickup points runs.
    options:
      - { id: I5o1, description: "Modular structure of separable components" }
      - { id: I5o2, description: "Front-loaded timeline with early commitments" }
      - { id: I5o3, description: "Periodic review with built-in adjustment windows" }
      - { id: I5o4, description: "Milestone-based commitments released in stages" }

agents:
  - id: skydrop
    agent_type: hard_bargainer
    min_threshold: 64
    goal_description: |
      You represent SkyDrop Logistics. You want a neighborhood library pickup mesh for public-service deliveries approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
    priority_description: |
      Your top priority is I1o2 ("Front-loaded timeline with early commitments") on Environmental and Noise Controls: it is worth clearly more to you than any other single option on the table.
      Your second priority is I5o3 ("Periodic review with built-in adjustment windows") on Safety Operating Envelope — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I2o2, I3o4, I4o1, but none of them is worth a war: workable alternatives there cost you only a modest amount.
    priority_narrative: |
      - Issue I1 (max score 39): I1o1(24), I1o2(39), I1o3(3), I1o4(1)
      - Issue I2 (max score 12): I2o1(0), I2o2(12), I2o3(11), I2o4(0)
      - Issue I3 (max score 11): I3o1(0), I3o2(9), I3o3(1), I3o4(11)
      - Issue I4 (max score 11): I4o1(11), I4o2(10), I4o3(1), I4o4(0)
      - Issue I5 (max score 27): I5o1(3), I5o2(0), I5o3(27), I5o4(13)
    issue_max_scores: { I1: 39, I2: 12, I3: 11, I4: 11, I5: 27 }
    scores:
      I1: { I1o1: 24, I1o2: 39, I1o3: 3, I1o4: 1 }
      I2: { I2o1: 0, I2o2: 12, I2o3: 11, I2o4: 0 }
      I3: { I3o1: 0, I3o2: 9, I3o3: 1, I3o4: 11 }
      I4: { I4o1: 11, I4o2: 10, I4o3: 1, I4o4: 0 }
      I5: { I5o1: 3, I5o2: 0, I5o3: 27, I5o4: 13 }
    preference_examples_about_others: |
      City Transport will press for public control, fiscal defensibility, and operational accountability. It has signaled that its single biggest prize is I1o4 ("Performance benchmarks with defined trigger points") on Environmental and Noise Controls, and that it also strongly prefers I5o4 ("Milestone-based commitments released in stages") on Safety Operating Envelope. Privacy Coalition will prioritize data limits, community safeguards, and cautious rollout. It has signaled that it cares most about I3o4 ("Milestone-based commitments released in stages") on Operating Economics, and that it also values I4o1 ("Back-loaded timeline with deferred commitments") on Oversight and Data Rules. Couriers Guild will push for job protections, retraining, and worker recourse. It has signaled that it cares most about I2o3 ("Front-loaded timeline with early commitments") on Deployment Footprint, and that it also values I4o1 ("Back-loaded timeline with deferred commitments") on Oversight and Data Rules. Aviation Safety will prioritize conservative operating envelopes, regulator visibility, and incident-response authority. It has signaled that it cares most about I2o4 ("Pilot-first design with conditional expansion") on Deployment Footprint, and that I1o1 ("Modular structure of separable components") on Environmental and Noise Controls is the direction it can support on that issue.

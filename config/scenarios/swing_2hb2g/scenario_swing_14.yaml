difficulty: hard

design:
  pool_options:
    I1: [I1o2, I1o3]
    I2: [I2o3, I2o4]
    I3: [I3o3]
    I4: [I4o1, I4o2]
    I5: [I5o1, I5o3]
  swing:
    seesaw_issue: I5
    swing_margin_band: [2, 8]
    comfort_min: 12
    hb_seesaw_favorite: { skydrop: I5o1, city_transport: I5o3 }
    swing_deal_counts: { skydrop: 5, city_transport: 3 }

project:
  name: "Port Freight Connector"
  shared_description: |
    The parties are deciding whether to authorize a port-to-warehouse freight connector using managed aerial and curb assets. The agreement must settle five issues governing the port connector. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
    - id: skydrop
      display_name: "SkyDrop Logistics"
    - id: city_transport
      display_name: "Chicago Department of Transportation"
    - id: privacy_coalition
      display_name: "Digital Rights and Neighborhood Coalition"
    - id: couriers_guild
      display_name: "Chicago Couriers' Guild"
    - id: aviation_safety
      display_name: "Civil Aviation Safety Board"

issues:
  - id: I1
    name: "Workforce Transition"
    description: |
      How the port connector handles labor standards, retraining, and affected workers.
    options:
      - { id: I1o1, description: "Performance benchmarks with defined trigger points" }
      - { id: I1o2, description: "Milestone-based commitments released in stages" }
      - { id: I1o3, description: "Tiered requirements with graduated thresholds" }
      - { id: I1o4, description: "Consolidated administration under unified terms" }
  - id: I2
    name: "Deployment Footprint"
    description: |
      Where and how broadly the port connector will launch before any expansion.
    options:
      - { id: I2o1, description: "Outcome-based design with measurable targets" }
      - { id: I2o2, description: "Consolidated administration under unified terms" }
      - { id: I2o3, description: "Performance benchmarks with defined trigger points" }
      - { id: I2o4, description: "Pilot-first design with conditional expansion" }
  - id: I3
    name: "Environmental and Noise Controls"
    description: |
      How the port connector manages noise, emissions, and environmental accountability.
    options:
      - { id: I3o1, description: "Tiered requirements with graduated thresholds" }
      - { id: I3o2, description: "Front-loaded timeline with early commitments" }
      - { id: I3o3, description: "Back-loaded timeline with deferred commitments" }
      - { id: I3o4, description: "Outcome-based design with measurable targets" }
  - id: I4
    name: "Operating Economics"
    description: |
      How the port connector will divide fees, revenue exposure, and operating risk.
    options:
      - { id: I4o1, description: "Tiered requirements with graduated thresholds" }
      - { id: I4o2, description: "Front-loaded timeline with early commitments" }
      - { id: I4o3, description: "Modular structure of separable components" }
      - { id: I4o4, description: "Consolidated administration under unified terms" }
  - id: I5
    name: "Safety Operating Envelope"
    description: |
      What operating constraints and safety checks apply while the port connector runs.
    options:
      - { id: I5o1, description: "Consolidated administration under unified terms" }
      - { id: I5o2, description: "Outcome-based design with measurable targets" }
      - { id: I5o3, description: "Milestone-based commitments released in stages" }
      - { id: I5o4, description: "Pilot-first design with conditional expansion" }

agents:
  - id: skydrop
    agent_type: hard_bargainer
    min_threshold: 62
    goal_description: |
      You represent SkyDrop Logistics. You want a port-to-warehouse freight connector using managed aerial and curb assets approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
    priority_description: |
      Your top priority is I3o1 ("Tiered requirements with graduated thresholds") on Environmental and Noise Controls: it is worth clearly more to you than any other single option on the table.
      Your second priority is I5o1 ("Consolidated administration under unified terms") on Safety Operating Envelope — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I1o3, I2o3, I4o2, but none of them is worth a war: workable alternatives there cost you only a modest amount.
    priority_narrative: |
      - Issue I1 (max score 11): I1o1(0), I1o2(10), I1o3(11), I1o4(2)
      - Issue I2 (max score 11): I2o1(2), I2o2(0), I2o3(11), I2o4(9)
      - Issue I3 (max score 40): I3o1(40), I3o2(1), I3o3(24), I3o4(1)
      - Issue I4 (max score 11): I4o1(10), I4o2(11), I4o3(3), I4o4(0)
      - Issue I5 (max score 27): I5o1(27), I5o2(3), I5o3(12), I5o4(1)
    issue_max_scores: { I1: 11, I2: 11, I3: 40, I4: 11, I5: 27 }
    scores:
      I1: { I1o1: 0, I1o2: 10, I1o3: 11, I1o4: 2 }
      I2: { I2o1: 2, I2o2: 0, I2o3: 11, I2o4: 9 }
      I3: { I3o1: 40, I3o2: 1, I3o3: 24, I3o4: 1 }
      I4: { I4o1: 10, I4o2: 11, I4o3: 3, I4o4: 0 }
      I5: { I5o1: 27, I5o2: 3, I5o3: 12, I5o4: 1 }
    preference_examples_about_others: |
      City Transport will press for public control, fiscal defensibility, and operational accountability. It has signaled that its single biggest prize is I3o4 ("Outcome-based design with measurable targets") on Environmental and Noise Controls, and that it also strongly prefers I5o3 ("Milestone-based commitments released in stages") on Safety Operating Envelope. Privacy Coalition will prioritize data limits, community safeguards, and cautious rollout. It has signaled that it cares most about I4o2 ("Front-loaded timeline with early commitments") on Operating Economics, and that it also values I1o3 ("Tiered requirements with graduated thresholds") on Workforce Transition. Couriers Guild will push for job protections, retraining, and worker recourse. It has signaled that it cares most about I2o4 ("Pilot-first design with conditional expansion") on Deployment Footprint, and that it also values I1o3 ("Tiered requirements with graduated thresholds") on Workforce Transition. Aviation Safety will prioritize conservative operating envelopes, regulator visibility, and incident-response authority. It has signaled that it cares most about I4o3 ("Modular structure of separable components") on Operating Economics, and that I3o3 ("Back-loaded timeline with deferred commitments") on Environmental and Noise Controls is the direction it can support on that issue.

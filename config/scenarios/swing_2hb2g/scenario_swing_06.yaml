difficulty: hard

design:
  pool_options:
    I1: [I1o1, I1o3]
    I2: [I2o1, I2o2]
    I3: [I3o2, I3o3]
    I4: [I4o1, I4o3]
    I5: [I5o4]
  swing:
    seesaw_issue: I1
    swing_margin_band: [2, 8]
    comfort_min: 12
    hb_seesaw_favorite: { skydrop: I1o3, city_transport: I1o1 }
    swing_deal_counts: { skydrop: 3, city_transport: 5 }

project:
  name: "Stadium Event Logistics Grid"
  shared_description: |
    The parties are deciding whether to authorize an event-day logistics grid around stadiums and venues. The agreement must settle five issues governing the event logistics. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
    - id: skydrop
      display_name: "SkyDrop Logistics"
    - id: city_transport
      display_name: "Chicago Department of Transportation"
    - id: privacy_coalition
      display_name: "Digital Rights and Neighborhood Coalition"
    - id: couriers_guild
      display_name: "Chicago Couriers' Guild"
    - id: aviation_safety
      display_name: "Civil Aviation Safety Board"

issues:
  - id: I1
    name: "Oversight and Data Rules"
    description: |
      What audit, data, and transparency obligations govern the event logistics.
    options:
      - { id: I1o1, description: "Phased rollout with scheduled checkpoints" }
      - { id: I1o2, description: "Consolidated administration under unified terms" }
      - { id: I1o3, description: "Milestone-based commitments released in stages" }
      - { id: I1o4, description: "Back-loaded timeline with deferred commitments" }
  - id: I2
    name: "Community Access"
    description: |
      How neighborhoods receive benefits, recourse, and access from the event logistics.
    options:
      - { id: I2o1, description: "Phased rollout with scheduled checkpoints" }
      - { id: I2o2, description: "Consolidated administration under unified terms" }
      - { id: I2o3, description: "Modular structure of separable components" }
      - { id: I2o4, description: "Back-loaded timeline with deferred commitments" }
  - id: I3
    name: "Environmental and Noise Controls"
    description: |
      How the event logistics manages noise, emissions, and environmental accountability.
    options:
      - { id: I3o1, description: "Back-loaded timeline with deferred commitments" }
      - { id: I3o2, description: "Milestone-based commitments released in stages" }
      - { id: I3o3, description: "Outcome-based design with measurable targets" }
      - { id: I3o4, description: "Performance benchmarks with defined trigger points" }
  - id: I4
    name: "Workforce Transition"
    description: |
      How the event logistics handles labor standards, retraining, and affected workers.
    options:
      - { id: I4o1, description: "Performance benchmarks with defined trigger points" }
      - { id: I4o2, description: "Modular structure of separable components" }
      - { id: I4o3, description: "Consolidated administration under unified terms" }
      - { id: I4o4, description: "Standardized baseline terms with fixed criteria" }
  - id: I5
    name: "Safety Operating Envelope"
    description: |
      What operating constraints and safety checks apply while the event logistics runs.
    options:
      - { id: I5o1, description: "Milestone-based commitments released in stages" }
      - { id: I5o2, description: "Consolidated administration under unified terms" }
      - { id: I5o3, description: "Outcome-based design with measurable targets" }
      - { id: I5o4, description: "Front-loaded timeline with early commitments" }

agents:
  - id: skydrop
    agent_type: hard_bargainer
    min_threshold: 61
    goal_description: |
      You represent SkyDrop Logistics. You want an event-day logistics grid around stadiums and venues approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
    priority_description: |
      Your top priority is I5o1 ("Milestone-based commitments released in stages") on Safety Operating Envelope: it is worth clearly more to you than any other single option on the table.
      Your second priority is I1o3 ("Milestone-based commitments released in stages") on Oversight and Data Rules — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I2o1, I3o2, I4o3, but none of them is worth a war: workable alternatives there cost you only a modest amount.
    priority_narrative: |
      - Issue I1 (max score 25): I1o1(11), I1o2(1), I1o3(25), I1o4(2)
      - Issue I2 (max score 11): I2o1(11), I2o2(9), I2o3(0), I2o4(2)
      - Issue I3 (max score 11): I3o1(0), I3o2(11), I3o3(11), I3o4(3)
      - Issue I4 (max score 12): I4o1(11), I4o2(3), I4o3(12), I4o4(0)
      - Issue I5 (max score 41): I5o1(41), I5o2(1), I5o3(3), I5o4(23)
    issue_max_scores: { I1: 25, I2: 11, I3: 11, I4: 12, I5: 41 }
    scores:
      I1: { I1o1: 11, I1o2: 1, I1o3: 25, I1o4: 2 }
      I2: { I2o1: 11, I2o2: 9, I2o3: 0, I2o4: 2 }
      I3: { I3o1: 0, I3o2: 11, I3o3: 11, I3o4: 3 }
      I4: { I4o1: 11, I4o2: 3, I4o3: 12, I4o4: 0 }
      I5: { I5o1: 41, I5o2: 1, I5o3: 3, I5o4: 23 }
    preference_examples_about_others: |
      City Transport will press for public control, fiscal defensibility, and operational accountability. It has signaled that its single biggest prize is I5o2 ("Consolidated administration under unified terms") on Safety Operating Envelope, and that it also strongly prefers I1o1 ("Phased rollout with scheduled checkpoints") on Oversight and Data Rules. Privacy Coalition will prioritize data limits, community safeguards, and cautious rollout. It has signaled that it cares most about I2o2 ("Consolidated administration under unified terms") on Community Access, and that it also values I4o1 ("Performance benchmarks with defined trigger points") on Workforce Transition. Couriers Guild will push for job protections, retraining, and worker recourse. It has signaled that it cares most about I3o2 ("Milestone-based commitments released in stages") on Environmental and Noise Controls, and that it also values I4o1 ("Performance benchmarks with defined trigger points") on Workforce Transition. Aviation Safety will prioritize conservative operating envelopes, regulator visibility, and incident-response authority. It has signaled that it cares most about I1o2 ("Consolidated administration under unified terms") on Oversight and Data Rules, and that I5o4 ("Front-loaded timeline with early commitments") on Safety Operating Envelope is the direction it can support on that issue.

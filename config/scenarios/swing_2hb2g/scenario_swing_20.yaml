difficulty: hard

design:
  pool_options:
    I1: [I1o2, I1o3]
    I2: [I2o1, I2o4]
    I3: [I3o1]
    I4: [I4o3, I4o4]
    I5: [I5o1, I5o3]
  swing:
    seesaw_issue: I2
    swing_margin_band: [2, 8]
    comfort_min: 12
    hb_seesaw_favorite: { skydrop: I2o4, city_transport: I2o1 }
    swing_deal_counts: { skydrop: 5, city_transport: 5 }

project:
  name: "Brownfield Depot Conversion"
  shared_description: |
    The parties are deciding whether to authorize a brownfield depot conversion for clean neighborhood logistics. The agreement must settle five issues governing the depot conversion. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
    - id: skydrop
      display_name: "SkyDrop Logistics"
    - id: city_transport
      display_name: "Chicago Department of Transportation"
    - id: privacy_coalition
      display_name: "Digital Rights and Neighborhood Coalition"
    - id: couriers_guild
      display_name: "Chicago Couriers' Guild"
    - id: aviation_safety
      display_name: "Civil Aviation Safety Board"

issues:
  - id: I1
    name: "Workforce Transition"
    description: |
      How the depot conversion handles labor standards, retraining, and affected workers.
    options:
      - { id: I1o1, description: "Front-loaded timeline with early commitments" }
      - { id: I1o2, description: "Back-loaded timeline with deferred commitments" }
      - { id: I1o3, description: "Outcome-based design with measurable targets" }
      - { id: I1o4, description: "Standardized baseline terms with fixed criteria" }
  - id: I2
    name: "Community Access"
    description: |
      How neighborhoods receive benefits, recourse, and access from the depot conversion.
    options:
      - { id: I2o1, description: "Phased rollout with scheduled checkpoints" }
      - { id: I2o2, description: "Back-loaded timeline with deferred commitments" }
      - { id: I2o3, description: "Periodic review with built-in adjustment windows" }
      - { id: I2o4, description: "Front-loaded timeline with early commitments" }
  - id: I3
    name: "Oversight and Data Rules"
    description: |
      What audit, data, and transparency obligations govern the depot conversion.
    options:
      - { id: I3o1, description: "Phased rollout with scheduled checkpoints" }
      - { id: I3o2, description: "Milestone-based commitments released in stages" }
      - { id: I3o3, description: "Back-loaded timeline with deferred commitments" }
      - { id: I3o4, description: "Front-loaded timeline with early commitments" }
  - id: I4
    name: "Safety Operating Envelope"
    description: |
      What operating constraints and safety checks apply while the depot conversion runs.
    options:
      - { id: I4o1, description: "Outcome-based design with measurable targets" }
      - { id: I4o2, description: "Front-loaded timeline with early commitments" }
      - { id: I4o3, description: "Periodic review with built-in adjustment windows" }
      - { id: I4o4, description: "Modular structure of separable components" }
  - id: I5
    name: "Deployment Footprint"
    description: |
      Where and how broadly the depot conversion will launch before any expansion.
    options:
      - { id: I5o1, description: "Modular structure of separable components" }
      - { id: I5o2, description: "Pilot-first design with conditional expansion" }
      - { id: I5o3, description: "Standardized baseline terms with fixed criteria" }
      - { id: I5o4, description: "Front-loaded timeline with early commitments" }

agents:
  - id: skydrop
    agent_type: hard_bargainer
    min_threshold: 61
    goal_description: |
      You represent SkyDrop Logistics. You want a brownfield depot conversion for clean neighborhood logistics approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
    priority_description: |
      Your top priority is I3o2 ("Milestone-based commitments released in stages") on Oversight and Data Rules: it is worth clearly more to you than any other single option on the table.
      Your second priority is I2o4 ("Front-loaded timeline with early commitments") on Community Access — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I1o2, I4o4, I5o1, but none of them is worth a war: workable alternatives there cost you only a modest amount.
    priority_narrative: |
      - Issue I1 (max score 11): I1o1(1), I1o2(11), I1o3(9), I1o4(3)
      - Issue I2 (max score 26): I2o1(11), I2o2(0), I2o3(0), I2o4(26)
      - Issue I3 (max score 41): I3o1(24), I3o2(41), I3o3(1), I3o4(3)
      - Issue I4 (max score 11): I4o1(3), I4o2(1), I4o3(10), I4o4(11)
      - Issue I5 (max score 11): I5o1(11), I5o2(0), I5o3(11), I5o4(1)
    issue_max_scores: { I1: 11, I2: 26, I3: 41, I4: 11, I5: 11 }
    scores:
      I1: { I1o1: 1, I1o2: 11, I1o3: 9, I1o4: 3 }
      I2: { I2o1: 11, I2o2: 0, I2o3: 0, I2o4: 26 }
      I3: { I3o1: 24, I3o2: 41, I3o3: 1, I3o4: 3 }
      I4: { I4o1: 3, I4o2: 1, I4o3: 10, I4o4: 11 }
      I5: { I5o1: 11, I5o2: 0, I5o3: 11, I5o4: 1 }
    preference_examples_about_others: |
      City Transport will press for public control, fiscal defensibility, and operational accountability. It has signaled that its single biggest prize is I3o3 ("Back-loaded timeline with deferred commitments") on Oversight and Data Rules, and that it also strongly prefers I2o1 ("Phased rollout with scheduled checkpoints") on Community Access. Privacy Coalition will prioritize data limits, community safeguards, and cautious rollout. It has signaled that it cares most about I1o3 ("Outcome-based design with measurable targets") on Workforce Transition, and that it also values I4o3 ("Periodic review with built-in adjustment windows") on Safety Operating Envelope. Couriers Guild will push for job protections, retraining, and worker recourse. It has signaled that it cares most about I5o1 ("Modular structure of separable components") on Deployment Footprint, and that it also values I4o3 ("Periodic review with built-in adjustment windows") on Safety Operating Envelope. Aviation Safety will prioritize conservative operating envelopes, regulator visibility, and incident-response authority. It has signaled that it cares most about I1o1 ("Front-loaded timeline with early commitments") on Workforce Transition, and that I3o1 ("Phased rollout with scheduled checkpoints") on Oversight and Data Rules is the direction it can support on that issue.

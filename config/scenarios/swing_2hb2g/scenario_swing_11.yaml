difficulty: hard

design:
  pool_options:
    I1: [I1o2, I1o4]
    I2: [I2o2, I2o3]
    I3: [I3o2, I3o4]
    I4: [I4o1, I4o4]
    I5: [I5o4]
  swing:
    seesaw_issue: I3
    swing_margin_band: [2, 8]
    comfort_min: 12
    hb_seesaw_favorite: { skydrop: I3o2, city_transport: I3o4 }
    swing_deal_counts: { skydrop: 5, city_transport: 4 }

project:
  name: "Cold-Chain Access Routes"
  shared_description: |
    The parties are deciding whether to authorize a cold-chain delivery network for underserved grocery access. The agreement must settle five issues governing the cold-chain routes. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
    - id: skydrop
      display_name: "SkyDrop Logistics"
    - id: city_transport
      display_name: "Chicago Department of Transportation"
    - id: privacy_coalition
      display_name: "Digital Rights and Neighborhood Coalition"
    - id: couriers_guild
      display_name: "Chicago Couriers' Guild"
    - id: aviation_safety
      display_name: "Civil Aviation Safety Board"

issues:
  - id: I1
    name: "Environmental and Noise Controls"
    description: |
      How the cold-chain routes manages noise, emissions, and environmental accountability.
    options:
      - { id: I1o1, description: "Outcome-based design with measurable targets" }
      - { id: I1o2, description: "Back-loaded timeline with deferred commitments" }
      - { id: I1o3, description: "Periodic review with built-in adjustment windows" }
      - { id: I1o4, description: "Tiered requirements with graduated thresholds" }
  - id: I2
    name: "Operating Economics"
    description: |
      How the cold-chain routes will divide fees, revenue exposure, and operating risk.
    options:
      - { id: I2o1, description: "Milestone-based commitments released in stages" }
      - { id: I2o2, description: "Pilot-first design with conditional expansion" }
      - { id: I2o3, description: "Performance benchmarks with defined trigger points" }
      - { id: I2o4, description: "Phased rollout with scheduled checkpoints" }
  - id: I3
    name: "Deployment Footprint"
    description: |
      Where and how broadly the cold-chain routes will launch before any expansion.
    options:
      - { id: I3o1, description: "Standardized baseline terms with fixed criteria" }
      - { id: I3o2, description: "Outcome-based design with measurable targets" }
      - { id: I3o3, description: "Phased rollout with scheduled checkpoints" }
      - { id: I3o4, description: "Modular structure of separable components" }
  - id: I4
    name: "Safety Operating Envelope"
    description: |
      What operating constraints and safety checks apply while the cold-chain routes runs.
    options:
      - { id: I4o1, description: "Milestone-based commitments released in stages" }
      - { id: I4o2, description: "Tiered requirements with graduated thresholds" }
      - { id: I4o3, description: "Pilot-first design with conditional expansion" }
      - { id: I4o4, description: "Phased rollout with scheduled checkpoints" }
  - id: I5
    name: "Oversight and Data Rules"
    description: |
      What audit, data, and transparency obligations govern the cold-chain routes.
    options:
      - { id: I5o1, description: "Modular structure of separable components" }
      - { id: I5o2, description: "Performance benchmarks with defined trigger points" }
      - { id: I5o3, description: "Periodic review with built-in adjustment windows" }
      - { id: I5o4, description: "Consolidated administration under unified terms" }

agents:
  - id: skydrop
    agent_type: hard_bargainer
    min_threshold: 63
    goal_description: |
      You represent SkyDrop Logistics. You want a cold-chain delivery network for underserved grocery access approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
    priority_description: |
      Your top priority is I5o3 ("Periodic review with built-in adjustment windows") on Oversight and Data Rules: it is worth clearly more to you than any other single option on the table.
      Your second priority is I3o2 ("Outcome-based design with measurable targets") on Deployment Footprint — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I1o2, I2o2, I4o1, but none of them is worth a war: workable alternatives there cost you only a modest amount.
    priority_narrative: |
      - Issue I1 (max score 11): I1o1(1), I1o2(11), I1o3(3), I1o4(11)
      - Issue I2 (max score 11): I2o1(0), I2o2(11), I2o3(11), I2o4(2)
      - Issue I3 (max score 26): I3o1(3), I3o2(26), I3o3(0), I3o4(11)
      - Issue I4 (max score 11): I4o1(11), I4o2(3), I4o3(1), I4o4(9)
      - Issue I5 (max score 41): I5o1(0), I5o2(1), I5o3(41), I5o4(26)
    issue_max_scores: { I1: 11, I2: 11, I3: 26, I4: 11, I5: 41 }
    scores:
      I1: { I1o1: 1, I1o2: 11, I1o3: 3, I1o4: 11 }
      I2: { I2o1: 0, I2o2: 11, I2o3: 11, I2o4: 2 }
      I3: { I3o1: 3, I3o2: 26, I3o3: 0, I3o4: 11 }
      I4: { I4o1: 11, I4o2: 3, I4o3: 1, I4o4: 9 }
      I5: { I5o1: 0, I5o2: 1, I5o3: 41, I5o4: 26 }
    preference_examples_about_others: |
      City Transport will press for public control, fiscal defensibility, and operational accountability. It has signaled that its single biggest prize is I5o2 ("Performance benchmarks with defined trigger points") on Oversight and Data Rules, and that it also strongly prefers I3o4 ("Modular structure of separable components") on Deployment Footprint. Privacy Coalition will prioritize data limits, community safeguards, and cautious rollout. It has signaled that it cares most about I4o4 ("Phased rollout with scheduled checkpoints") on Safety Operating Envelope, and that it also values I2o3 ("Performance benchmarks with defined trigger points") on Operating Economics. Couriers Guild will push for job protections, retraining, and worker recourse. It has signaled that it cares most about I1o4 ("Tiered requirements with graduated thresholds") on Environmental and Noise Controls, and that it also values I2o3 ("Performance benchmarks with defined trigger points") on Operating Economics. Aviation Safety will prioritize conservative operating envelopes, regulator visibility, and incident-response authority. It has signaled that it cares most about I2o1 ("Milestone-based commitments released in stages") on Operating Economics, and that I5o4 ("Consolidated administration under unified terms") on Oversight and Data Rules is the direction it can support on that issue.

    goal_description: |
      You represent the Civil Aviation Safety Board. You want a cold-chain delivery network for underserved grocery access to include credible oversight, controlled operating conditions, clear incident-response authority, and safety assurances the public can trust. You hold this program to exacting standards and expect any package to reflect them in full.

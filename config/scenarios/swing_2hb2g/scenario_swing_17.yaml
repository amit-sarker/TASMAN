difficulty: hard

design:
  pool_options:
    I1: [I1o2, I1o3]
    I2: [I2o2]
    I3: [I3o1, I3o2]
    I4: [I4o3, I4o4]
    I5: [I5o3, I5o4]
  swing:
    seesaw_issue: I1
    swing_margin_band: [2, 8]
    comfort_min: 12
    hb_seesaw_favorite: { skydrop: I1o2, city_transport: I1o3 }
    swing_deal_counts: { skydrop: 5, city_transport: 3 }

project:
  name: "Airport Compliance Sandbox"
  shared_description: |
    The parties are deciding whether to authorize an airport-area compliance sandbox for regulated delivery operations. The agreement must settle five issues governing the airport sandbox. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
    - id: skydrop
      display_name: "SkyDrop Logistics"
    - id: city_transport
      display_name: "Chicago Department of Transportation"
    - id: privacy_coalition
      display_name: "Digital Rights and Neighborhood Coalition"
    - id: couriers_guild
      display_name: "Chicago Couriers' Guild"
    - id: aviation_safety
      display_name: "Civil Aviation Safety Board"

issues:
  - id: I1
    name: "Environmental and Noise Controls"
    description: |
      How the airport sandbox manages noise, emissions, and environmental accountability.
    options:
      - { id: I1o1, description: "Milestone-based commitments released in stages" }
      - { id: I1o2, description: "Pilot-first design with conditional expansion" }
      - { id: I1o3, description: "Front-loaded timeline with early commitments" }
      - { id: I1o4, description: "Tiered requirements with graduated thresholds" }
  - id: I2
    name: "Workforce Transition"
    description: |
      How the airport sandbox handles labor standards, retraining, and affected workers.
    options:
      - { id: I2o1, description: "Front-loaded timeline with early commitments" }
      - { id: I2o2, description: "Modular structure of separable components" }
      - { id: I2o3, description: "Phased rollout with scheduled checkpoints" }
      - { id: I2o4, description: "Consolidated administration under unified terms" }
  - id: I3
    name: "Community Access"
    description: |
      How neighborhoods receive benefits, recourse, and access from the airport sandbox.
    options:
      - { id: I3o1, description: "Consolidated administration under unified terms" }
      - { id: I3o2, description: "Front-loaded timeline with early commitments" }
      - { id: I3o3, description: "Tiered requirements with graduated thresholds" }
      - { id: I3o4, description: "Back-loaded timeline with deferred commitments" }
  - id: I4
    name: "Deployment Footprint"
    description: |
      Where and how broadly the airport sandbox will launch before any expansion.
    options:
      - { id: I4o1, description: "Performance benchmarks with defined trigger points" }
      - { id: I4o2, description: "Phased rollout with scheduled checkpoints" }
      - { id: I4o3, description: "Outcome-based design with measurable targets" }
      - { id: I4o4, description: "Periodic review with built-in adjustment windows" }
  - id: I5
    name: "Safety Operating Envelope"
    description: |
      What operating constraints and safety checks apply while the airport sandbox runs.
    options:
      - { id: I5o1, description: "Tiered requirements with graduated thresholds" }
      - { id: I5o2, description: "Outcome-based design with measurable targets" }
      - { id: I5o3, description: "Periodic review with built-in adjustment windows" }
      - { id: I5o4, description: "Pilot-first design with conditional expansion" }

agents:
  - id: skydrop
    agent_type: hard_bargainer
    min_threshold: 61
    goal_description: |
      You represent SkyDrop Logistics. You want an airport-area compliance sandbox for regulated delivery operations approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
    priority_description: |
      Your top priority is I2o1 ("Front-loaded timeline with early commitments") on Workforce Transition: it is worth clearly more to you than any other single option on the table.
      Your second priority is I1o2 ("Pilot-first design with conditional expansion") on Environmental and Noise Controls — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I3o1, I4o4, I5o3, but none of them is worth a war: workable alternatives there cost you only a modest amount.
    priority_narrative: |
      - Issue I1 (max score 25): I1o1(0), I1o2(25), I1o3(10), I1o4(3)
      - Issue I2 (max score 41): I2o1(41), I2o2(23), I2o3(0), I2o4(0)
      - Issue I3 (max score 10): I3o1(10), I3o2(9), I3o3(3), I3o4(1)
      - Issue I4 (max score 11): I4o1(1), I4o2(3), I4o3(10), I4o4(11)
      - Issue I5 (max score 13): I5o1(1), I5o2(1), I5o3(13), I5o4(13)
    issue_max_scores: { I1: 25, I2: 41, I3: 10, I4: 11, I5: 13 }
    scores:
      I1: { I1o1: 0, I1o2: 25, I1o3: 10, I1o4: 3 }
      I2: { I2o1: 41, I2o2: 23, I2o3: 0, I2o4: 0 }
      I3: { I3o1: 10, I3o2: 9, I3o3: 3, I3o4: 1 }
      I4: { I4o1: 1, I4o2: 3, I4o3: 10, I4o4: 11 }
      I5: { I5o1: 1, I5o2: 1, I5o3: 13, I5o4: 13 }
    preference_examples_about_others: |
      City Transport will press for public control, fiscal defensibility, and operational accountability. It has signaled that its single biggest prize is I2o3 ("Phased rollout with scheduled checkpoints") on Workforce Transition, and that it also strongly prefers I1o3 ("Front-loaded timeline with early commitments") on Environmental and Noise Controls. Privacy Coalition will prioritize data limits, community safeguards, and cautious rollout. It has signaled that it cares most about I4o3 ("Outcome-based design with measurable targets") on Deployment Footprint, and that it also values I3o1 ("Consolidated administration under unified terms") on Community Access. Couriers Guild will push for job protections, retraining, and worker recourse. It has signaled that it cares most about I5o3 ("Periodic review with built-in adjustment windows") on Safety Operating Envelope, and that it also values I3o1 ("Consolidated administration under unified terms") on Community Access. Aviation Safety will prioritize conservative operating envelopes, regulator visibility, and incident-response authority. It has signaled that it cares most about I4o1 ("Performance benchmarks with defined trigger points") on Deployment Footprint, and that I2o2 ("Modular structure of separable components") on Workforce Transition is the direction it can support on that issue.

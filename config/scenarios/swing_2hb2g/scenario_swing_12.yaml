difficulty: hard

design:
  pool_options:
    I1: [I1o3]
    I2: [I2o1, I2o2]
    I3: [I3o1, I3o2]
    I4: [I4o1, I4o2]
    I5: [I5o1, I5o4]
  swing:
    seesaw_issue: I2
    swing_margin_band: [2, 8]
    comfort_min: 12
    hb_seesaw_favorite: { skydrop: I2o2, city_transport: I2o1 }
    swing_deal_counts: { skydrop: 5, city_transport: 5 }

project:
  name: "Transit Parcel Exchange"
  shared_description: |
    The parties are deciding whether to authorize a transit-station parcel exchange tied to bus and rail nodes. The agreement must settle five issues governing the station exchange points. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
    - id: skydrop
      display_name: "SkyDrop Logistics"
    - id: city_transport
      display_name: "Chicago Department of Transportation"
    - id: privacy_coalition
      display_name: "Digital Rights and Neighborhood Coalition"
    - id: couriers_guild
      display_name: "Chicago Couriers' Guild"
    - id: aviation_safety
      display_name: "Civil Aviation Safety Board"

issues:
  - id: I1
    name: "Safety Operating Envelope"
    description: |
      What operating constraints and safety checks apply while the station exchange points runs.
    options:
      - { id: I1o1, description: "Outcome-based design with measurable targets" }
      - { id: I1o2, description: "Back-loaded timeline with deferred commitments" }
      - { id: I1o3, description: "Standardized baseline terms with fixed criteria" }
      - { id: I1o4, description: "Modular structure of separable components" }
  - id: I2
    name: "Deployment Footprint"
    description: |
      Where and how broadly the station exchange points will launch before any expansion.
    options:
      - { id: I2o1, description: "Performance benchmarks with defined trigger points" }
      - { id: I2o2, description: "Front-loaded timeline with early commitments" }
      - { id: I2o3, description: "Periodic review with built-in adjustment windows" }
      - { id: I2o4, description: "Modular structure of separable components" }
  - id: I3
    name: "Community Access"
    description: |
      How neighborhoods receive benefits, recourse, and access from the station exchange points.
    options:
      - { id: I3o1, description: "Consolidated administration under unified terms" }
      - { id: I3o2, description: "Standardized baseline terms with fixed criteria" }
      - { id: I3o3, description: "Pilot-first design with conditional expansion" }
      - { id: I3o4, description: "Periodic review with built-in adjustment windows" }
  - id: I4
    name: "Workforce Transition"
    description: |
      How the station exchange points handles labor standards, retraining, and affected workers.
    options:
      - { id: I4o1, description: "Front-loaded timeline with early commitments" }
      - { id: I4o2, description: "Outcome-based design with measurable targets" }
      - { id: I4o3, description: "Performance benchmarks with defined trigger points" }
      - { id: I4o4, description: "Tiered requirements with graduated thresholds" }
  - id: I5
    name: "Environmental and Noise Controls"
    description: |
      How the station exchange points manages noise, emissions, and environmental accountability.
    options:
      - { id: I5o1, description: "Modular structure of separable components" }
      - { id: I5o2, description: "Phased rollout with scheduled checkpoints" }
      - { id: I5o3, description: "Standardized baseline terms with fixed criteria" }
      - { id: I5o4, description: "Outcome-based design with measurable targets" }

agents:
  - id: skydrop
    agent_type: hard_bargainer
    min_threshold: 64
    goal_description: |
      You represent SkyDrop Logistics. You want a transit-station parcel exchange tied to bus and rail nodes approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
    priority_description: |
      Your top priority is I1o2 ("Back-loaded timeline with deferred commitments") on Safety Operating Envelope: it is worth clearly more to you than any other single option on the table.
      Your second priority is I2o2 ("Front-loaded timeline with early commitments") on Deployment Footprint — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I3o1, I4o1, I5o4, but none of them is worth a war: workable alternatives there cost you only a modest amount.
    priority_narrative: |
      - Issue I1 (max score 39): I1o1(3), I1o2(39), I1o3(24), I1o4(0)
      - Issue I2 (max score 27): I2o1(13), I2o2(27), I2o3(1), I2o4(1)
      - Issue I3 (max score 11): I3o1(11), I3o2(11), I3o3(3), I3o4(2)
      - Issue I4 (max score 12): I4o1(12), I4o2(10), I4o3(0), I4o4(1)
      - Issue I5 (max score 11): I5o1(10), I5o2(1), I5o3(0), I5o4(11)
    issue_max_scores: { I1: 39, I2: 27, I3: 11, I4: 12, I5: 11 }
    scores:
      I1: { I1o1: 3, I1o2: 39, I1o3: 24, I1o4: 0 }
      I2: { I2o1: 13, I2o2: 27, I2o3: 1, I2o4: 1 }
      I3: { I3o1: 11, I3o2: 11, I3o3: 3, I3o4: 2 }
      I4: { I4o1: 12, I4o2: 10, I4o3: 0, I4o4: 1 }
      I5: { I5o1: 10, I5o2: 1, I5o3: 0, I5o4: 11 }
    preference_examples_about_others: |
      City Transport will press for public control, fiscal defensibility, and operational accountability. It has signaled that its single biggest prize is I1o4 ("Modular structure of separable components") on Safety Operating Envelope, and that it also strongly prefers I2o1 ("Performance benchmarks with defined trigger points") on Deployment Footprint. Privacy Coalition will prioritize data limits, community safeguards, and cautious rollout. It has signaled that it cares most about I3o2 ("Standardized baseline terms with fixed criteria") on Community Access, and that it also values I5o4 ("Outcome-based design with measurable targets") on Environmental and Noise Controls. Couriers Guild will push for job protections, retraining, and worker recourse. It has signaled that it cares most about I4o1 ("Front-loaded timeline with early commitments") on Workforce Transition, and that it also values I5o4 ("Outcome-based design with measurable targets") on Environmental and Noise Controls. Aviation Safety will prioritize conservative operating envelopes, regulator visibility, and incident-response authority. It has signaled that it cares most about I3o3 ("Pilot-first design with conditional expansion") on Community Access, and that I1o3 ("Standardized baseline terms with fixed criteria") on Safety Operating Envelope is the direction it can support on that issue.

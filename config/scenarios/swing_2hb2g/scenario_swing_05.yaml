difficulty: hard

design:
  pool_options:
    I1: [I1o3]
    I2: [I2o2, I2o3]
    I3: [I3o3, I3o4]
    I4: [I4o2, I4o4]
    I5: [I5o1, I5o3]
  swing:
    seesaw_issue: I2
    swing_margin_band: [2, 8]
    comfort_min: 12
    hb_seesaw_favorite: { skydrop: I2o3, city_transport: I2o2 }
    swing_deal_counts: { skydrop: 5, city_transport: 5 }

project:
  name: "Night Delivery Noise Compact"
  shared_description: |
    The parties are deciding whether to authorize an overnight low-noise delivery pilot for dense districts. The agreement must settle five issues governing the night delivery routes. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
    - id: skydrop
      display_name: "SkyDrop Logistics"
    - id: city_transport
      display_name: "Chicago Department of Transportation"
    - id: privacy_coalition
      display_name: "Digital Rights and Neighborhood Coalition"
    - id: couriers_guild
      display_name: "Chicago Couriers' Guild"
    - id: aviation_safety
      display_name: "Civil Aviation Safety Board"

issues:
  - id: I1
    name: "Safety Operating Envelope"
    description: |
      What operating constraints and safety checks apply while the night delivery routes runs.
    options:
      - { id: I1o1, description: "Phased rollout with scheduled checkpoints" }
      - { id: I1o2, description: "Tiered requirements with graduated thresholds" }
      - { id: I1o3, description: "Outcome-based design with measurable targets" }
      - { id: I1o4, description: "Periodic review with built-in adjustment windows" }
  - id: I2
    name: "Deployment Footprint"
    description: |
      Where and how broadly the night delivery routes will launch before any expansion.
    options:
      - { id: I2o1, description: "Tiered requirements with graduated thresholds" }
      - { id: I2o2, description: "Milestone-based commitments released in stages" }
      - { id: I2o3, description: "Standardized baseline terms with fixed criteria" }
      - { id: I2o4, description: "Pilot-first design with conditional expansion" }
  - id: I3
    name: "Environmental and Noise Controls"
    description: |
      How the night delivery routes manages noise, emissions, and environmental accountability.
    options:
      - { id: I3o1, description: "Front-loaded timeline with early commitments" }
      - { id: I3o2, description: "Performance benchmarks with defined trigger points" }
      - { id: I3o3, description: "Standardized baseline terms with fixed criteria" }
      - { id: I3o4, description: "Pilot-first design with conditional expansion" }
  - id: I4
    name: "Workforce Transition"
    description: |
      How the night delivery routes handles labor standards, retraining, and affected workers.
    options:
      - { id: I4o1, description: "Consolidated administration under unified terms" }
      - { id: I4o2, description: "Milestone-based commitments released in stages" }
      - { id: I4o3, description: "Back-loaded timeline with deferred commitments" }
      - { id: I4o4, description: "Tiered requirements with graduated thresholds" }
  - id: I5
    name: "Operating Economics"
    description: |
      How the night delivery routes will divide fees, revenue exposure, and operating risk.
    options:
      - { id: I5o1, description: "Back-loaded timeline with deferred commitments" }
      - { id: I5o2, description: "Milestone-based commitments released in stages" }
      - { id: I5o3, description: "Outcome-based design with measurable targets" }
      - { id: I5o4, description: "Periodic review with built-in adjustment windows" }

agents:
  - id: skydrop
    agent_type: hard_bargainer
    min_threshold: 62
    goal_description: |
      You represent SkyDrop Logistics. You want an overnight low-noise delivery pilot for dense districts approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
    priority_description: |
      Your top priority is I1o2 ("Tiered requirements with graduated thresholds") on Safety Operating Envelope: it is worth clearly more to you than any other single option on the table.
      Your second priority is I2o3 ("Standardized baseline terms with fixed criteria") on Deployment Footprint — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I3o3, I4o2, I5o1, but none of them is worth a war: workable alternatives there cost you only a modest amount.
    priority_narrative: |
      - Issue I1 (max score 42): I1o1(1), I1o2(42), I1o3(24), I1o4(1)
      - Issue I2 (max score 25): I2o1(2), I2o2(11), I2o3(25), I2o4(2)
      - Issue I3 (max score 11): I3o1(1), I3o2(2), I3o3(11), I3o4(9)
      - Issue I4 (max score 12): I4o1(2), I4o2(12), I4o3(0), I4o4(10)
      - Issue I5 (max score 10): I5o1(10), I5o2(0), I5o3(10), I5o4(3)
    issue_max_scores: { I1: 42, I2: 25, I3: 11, I4: 12, I5: 10 }
    scores:
      I1: { I1o1: 1, I1o2: 42, I1o3: 24, I1o4: 1 }
      I2: { I2o1: 2, I2o2: 11, I2o3: 25, I2o4: 2 }
      I3: { I3o1: 1, I3o2: 2, I3o3: 11, I3o4: 9 }
      I4: { I4o1: 2, I4o2: 12, I4o3: 0, I4o4: 10 }
      I5: { I5o1: 10, I5o2: 0, I5o3: 10, I5o4: 3 }
    preference_examples_about_others: |
      City Transport will press for public control, fiscal defensibility, and operational accountability. It has signaled that its single biggest prize is I1o1 ("Phased rollout with scheduled checkpoints") on Safety Operating Envelope, and that it also strongly prefers I2o2 ("Milestone-based commitments released in stages") on Deployment Footprint. Privacy Coalition will prioritize data limits, community safeguards, and cautious rollout. It has signaled that it cares most about I3o4 ("Pilot-first design with conditional expansion") on Environmental and Noise Controls, and that it also values I4o2 ("Milestone-based commitments released in stages") on Workforce Transition. Couriers Guild will push for job protections, retraining, and worker recourse. It has signaled that it cares most about I5o3 ("Outcome-based design with measurable targets") on Operating Economics, and that it also values I4o2 ("Milestone-based commitments released in stages") on Workforce Transition. Aviation Safety will prioritize conservative operating envelopes, regulator visibility, and incident-response authority. It has signaled that it cares most about I4o1 ("Consolidated administration under unified terms") on Workforce Transition, and that I1o3 ("Outcome-based design with measurable targets") on Safety Operating Envelope is the direction it can support on that issue.

difficulty: hard

design:
  pool_options:
    I1: [I1o1, I1o3]
    I2: [I2o1, I2o2]
    I3: [I3o2, I3o3]
    I4: [I4o2]
    I5: [I5o1, I5o2]
  swing:
    seesaw_issue: I1
    swing_margin_band: [2, 8]
    comfort_min: 12
    hb_seesaw_favorite: { skydrop: I1o3, city_transport: I1o1 }
    swing_deal_counts: { skydrop: 3, city_transport: 5 }

project:
  name: "Autonomous Locker Network"
  shared_description: |
    The parties are deciding whether to authorize a network of automated parcel lockers near transit stops. The agreement must settle five issues governing the locker sites. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
    - id: skydrop
      display_name: "SkyDrop Logistics"
    - id: city_transport
      display_name: "Chicago Department of Transportation"
    - id: privacy_coalition
      display_name: "Digital Rights and Neighborhood Coalition"
    - id: couriers_guild
      display_name: "Chicago Couriers' Guild"
    - id: aviation_safety
      display_name: "Civil Aviation Safety Board"

issues:
  - id: I1
    name: "Workforce Transition"
    description: |
      How the locker sites handles labor standards, retraining, and affected workers.
    options:
      - { id: I1o1, description: "Performance benchmarks with defined trigger points" }
      - { id: I1o2, description: "Periodic review with built-in adjustment windows" }
      - { id: I1o3, description: "Consolidated administration under unified terms" }
      - { id: I1o4, description: "Back-loaded timeline with deferred commitments" }
  - id: I2
    name: "Deployment Footprint"
    description: |
      Where and how broadly the locker sites will launch before any expansion.
    options:
      - { id: I2o1, description: "Front-loaded timeline with early commitments" }
      - { id: I2o2, description: "Consolidated administration under unified terms" }
      - { id: I2o3, description: "Milestone-based commitments released in stages" }
      - { id: I2o4, description: "Phased rollout with scheduled checkpoints" }
  - id: I3
    name: "Community Access"
    description: |
      How neighborhoods receive benefits, recourse, and access from the locker sites.
    options:
      - { id: I3o1, description: "Tiered requirements with graduated thresholds" }
      - { id: I3o2, description: "Consolidated administration under unified terms" }
      - { id: I3o3, description: "Pilot-first design with conditional expansion" }
      - { id: I3o4, description: "Periodic review with built-in adjustment windows" }
  - id: I4
    name: "Environmental and Noise Controls"
    description: |
      How the locker sites manages noise, emissions, and environmental accountability.
    options:
      - { id: I4o1, description: "Back-loaded timeline with deferred commitments" }
      - { id: I4o2, description: "Milestone-based commitments released in stages" }
      - { id: I4o3, description: "Periodic review with built-in adjustment windows" }
      - { id: I4o4, description: "Outcome-based design with measurable targets" }
  - id: I5
    name: "Operating Economics"
    description: |
      How the locker sites will divide fees, revenue exposure, and operating risk.
    options:
      - { id: I5o1, description: "Consolidated administration under unified terms" }
      - { id: I5o2, description: "Front-loaded timeline with early commitments" }
      - { id: I5o3, description: "Milestone-based commitments released in stages" }
      - { id: I5o4, description: "Performance benchmarks with defined trigger points" }

agents:
  - id: skydrop
    agent_type: hard_bargainer
    min_threshold: 60
    goal_description: |
      You represent SkyDrop Logistics. You want a network of automated parcel lockers near transit stops approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
    priority_description: |
      Your top priority is I4o1 ("Back-loaded timeline with deferred commitments") on Environmental and Noise Controls: it is worth clearly more to you than any other single option on the table.
      Your second priority is I1o3 ("Consolidated administration under unified terms") on Workforce Transition — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I2o1, I3o2, I5o2, but none of them is worth a war: workable alternatives there cost you only a modest amount.
    priority_narrative: |
      - Issue I1 (max score 26): I1o1(10), I1o2(2), I1o3(26), I1o4(2)
      - Issue I2 (max score 10): I2o1(10), I2o2(9), I2o3(1), I2o4(1)
      - Issue I3 (max score 10): I3o1(2), I3o2(10), I3o3(10), I3o4(1)
      - Issue I4 (max score 44): I4o1(44), I4o2(26), I4o3(3), I4o4(1)
      - Issue I5 (max score 10): I5o1(9), I5o2(10), I5o3(3), I5o4(3)
    issue_max_scores: { I1: 26, I2: 10, I3: 10, I4: 44, I5: 10 }
    scores:
      I1: { I1o1: 10, I1o2: 2, I1o3: 26, I1o4: 2 }
      I2: { I2o1: 10, I2o2: 9, I2o3: 1, I2o4: 1 }
      I3: { I3o1: 2, I3o2: 10, I3o3: 10, I3o4: 1 }
      I4: { I4o1: 44, I4o2: 26, I4o3: 3, I4o4: 1 }
      I5: { I5o1: 9, I5o2: 10, I5o3: 3, I5o4: 3 }
    preference_examples_about_others: |
      City Transport will press for public control, fiscal defensibility, and operational accountability. It has signaled that its single biggest prize is I4o4 ("Outcome-based design with measurable targets") on Environmental and Noise Controls, and that it also strongly prefers I1o1 ("Performance benchmarks with defined trigger points") on Workforce Transition. Privacy Coalition will prioritize data limits, community safeguards, and cautious rollout. It has signaled that it cares most about I2o1 ("Front-loaded timeline with early commitments") on Deployment Footprint, and that it also values I5o1 ("Consolidated administration under unified terms") on Operating Economics. Couriers Guild will push for job protections, retraining, and worker recourse. It has signaled that it cares most about I3o2 ("Consolidated administration under unified terms") on Community Access, and that it also values I5o1 ("Consolidated administration under unified terms") on Operating Economics. Aviation Safety will prioritize conservative operating envelopes, regulator visibility, and incident-response authority. It has signaled that it cares most about I2o3 ("Milestone-based commitments released in stages") on Deployment Footprint, and that I4o2 ("Milestone-based commitments released in stages") on Environmental and Noise Controls is the direction it can support on that issue.

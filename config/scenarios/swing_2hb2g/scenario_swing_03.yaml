difficulty: hard

design:
  pool_options:
    I1: [I1o1, I1o3]
    I2: [I2o1, I2o2]
    I3: [I3o1, I3o2]
    I4: [I4o4]
    I5: [I5o1, I5o4]
  swing:
    seesaw_issue: I3
    swing_margin_band: [2, 8]
    comfort_min: 12
    hb_seesaw_favorite: { skydrop: I3o1, city_transport: I3o2 }
    swing_deal_counts: { skydrop: 4, city_transport: 6 }

project:
  name: "Medical Drone Corridor"
  shared_description: |
    The parties are deciding whether to authorize a medical supply drone corridor connecting clinics and labs. The agreement must settle five issues governing the medical payload routes. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
    - id: skydrop
      display_name: "SkyDrop Logistics"
    - id: city_transport
      display_name: "Chicago Department of Transportation"
    - id: privacy_coalition
      display_name: "Digital Rights and Neighborhood Coalition"
    - id: couriers_guild
      display_name: "Chicago Couriers' Guild"
    - id: aviation_safety
      display_name: "Civil Aviation Safety Board"

issues:
  - id: I1
    name: "Oversight and Data Rules"
    description: |
      What audit, data, and transparency obligations govern the medical payload routes.
    options:
      - { id: I1o1, description: "Milestone-based commitments released in stages" }
      - { id: I1o2, description: "Periodic review with built-in adjustment windows" }
      - { id: I1o3, description: "Standardized baseline terms with fixed criteria" }
      - { id: I1o4, description: "Performance benchmarks with defined trigger points" }
  - id: I2
    name: "Safety Operating Envelope"
    description: |
      What operating constraints and safety checks apply while the medical payload routes runs.
    options:
      - { id: I2o1, description: "Modular structure of separable components" }
      - { id: I2o2, description: "Phased rollout with scheduled checkpoints" }
      - { id: I2o3, description: "Consolidated administration under unified terms" }
      - { id: I2o4, description: "Performance benchmarks with defined trigger points" }
  - id: I3
    name: "Deployment Footprint"
    description: |
      Where and how broadly the medical payload routes will launch before any expansion.
    options:
      - { id: I3o1, description: "Milestone-based commitments released in stages" }
      - { id: I3o2, description: "Tiered requirements with graduated thresholds" }
      - { id: I3o3, description: "Front-loaded timeline with early commitments" }
      - { id: I3o4, description: "Standardized baseline terms with fixed criteria" }
  - id: I4
    name: "Community Access"
    description: |
      How neighborhoods receive benefits, recourse, and access from the medical payload routes.
    options:
      - { id: I4o1, description: "Outcome-based design with measurable targets" }
      - { id: I4o2, description: "Phased rollout with scheduled checkpoints" }
      - { id: I4o3, description: "Consolidated administration under unified terms" }
      - { id: I4o4, description: "Front-loaded timeline with early commitments" }
  - id: I5
    name: "Environmental and Noise Controls"
    description: |
      How the medical payload routes manages noise, emissions, and environmental accountability.
    options:
      - { id: I5o1, description: "Outcome-based design with measurable targets" }
      - { id: I5o2, description: "Performance benchmarks with defined trigger points" }
      - { id: I5o3, description: "Front-loaded timeline with early commitments" }
      - { id: I5o4, description: "Consolidated administration under unified terms" }

agents:
  - id: skydrop
    agent_type: hard_bargainer
    min_threshold: 63
    goal_description: |
      You represent SkyDrop Logistics. You want a medical supply drone corridor connecting clinics and labs approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
    priority_description: |
      Your top priority is I4o2 ("Phased rollout with scheduled checkpoints") on Community Access: it is worth clearly more to you than any other single option on the table.
      Your second priority is I3o1 ("Milestone-based commitments released in stages") on Deployment Footprint — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I1o1, I2o2, I5o1, but none of them is worth a war: workable alternatives there cost you only a modest amount.
    priority_narrative: |
      - Issue I1 (max score 10): I1o1(10), I1o2(1), I1o3(9), I1o4(3)
      - Issue I2 (max score 10): I2o1(8), I2o2(10), I2o3(1), I2o4(3)
      - Issue I3 (max score 26): I3o1(26), I3o2(12), I3o3(2), I3o4(1)
      - Issue I4 (max score 42): I4o1(1), I4o2(42), I4o3(1), I4o4(25)
      - Issue I5 (max score 12): I5o1(12), I5o2(0), I5o3(3), I5o4(12)
    issue_max_scores: { I1: 10, I2: 10, I3: 26, I4: 42, I5: 12 }
    scores:
      I1: { I1o1: 10, I1o2: 1, I1o3: 9, I1o4: 3 }
      I2: { I2o1: 8, I2o2: 10, I2o3: 1, I2o4: 3 }
      I3: { I3o1: 26, I3o2: 12, I3o3: 2, I3o4: 1 }
      I4: { I4o1: 1, I4o2: 42, I4o3: 1, I4o4: 25 }
      I5: { I5o1: 12, I5o2: 0, I5o3: 3, I5o4: 12 }
    preference_examples_about_others: |
      City Transport will press for public control, fiscal defensibility, and operational accountability. It has signaled that its single biggest prize is I4o3 ("Consolidated administration under unified terms") on Community Access, and that it also strongly prefers I3o2 ("Tiered requirements with graduated thresholds") on Deployment Footprint. Privacy Coalition will prioritize data limits, community safeguards, and cautious rollout. It has signaled that it cares most about I2o2 ("Phased rollout with scheduled checkpoints") on Safety Operating Envelope, and that it also values I1o3 ("Standardized baseline terms with fixed criteria") on Oversight and Data Rules. Couriers Guild will push for job protections, retraining, and worker recourse. It has signaled that it cares most about I5o4 ("Consolidated administration under unified terms") on Environmental and Noise Controls, and that it also values I1o3 ("Standardized baseline terms with fixed criteria") on Oversight and Data Rules. Aviation Safety will prioritize conservative operating envelopes, regulator visibility, and incident-response authority. It has signaled that it cares most about I1o2 ("Periodic review with built-in adjustment windows") on Oversight and Data Rules, and that I4o4 ("Front-loaded timeline with early commitments") on Community Access is the direction it can support on that issue.

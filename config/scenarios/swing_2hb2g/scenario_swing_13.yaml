difficulty: hard

design:
  pool_options:
    I1: [I1o1, I1o3]
    I2: [I2o2, I2o3]
    I3: [I3o1]
    I4: [I4o1, I4o4]
    I5: [I5o1, I5o2]
  swing:
    seesaw_issue: I5
    swing_margin_band: [2, 8]
    comfort_min: 12
    hb_seesaw_favorite: { skydrop: I5o2, city_transport: I5o1 }
    swing_deal_counts: { skydrop: 6, city_transport: 4 }

project:
  name: "Construction Lift Zone Pilot"
  shared_description: |
    The parties are deciding whether to authorize a construction-material lift-zone pilot for constrained work sites. The agreement must settle five issues governing the lift-zone service. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
    - id: skydrop
      display_name: "SkyDrop Logistics"
    - id: city_transport
      display_name: "Chicago Department of Transportation"
    - id: privacy_coalition
      display_name: "Digital Rights and Neighborhood Coalition"
    - id: couriers_guild
      display_name: "Chicago Couriers' Guild"
    - id: aviation_safety
      display_name: "Civil Aviation Safety Board"

issues:
  - id: I1
    name: "Environmental and Noise Controls"
    description: |
      How the lift-zone service manages noise, emissions, and environmental accountability.
    options:
      - { id: I1o1, description: "Outcome-based design with measurable targets" }
      - { id: I1o2, description: "Pilot-first design with conditional expansion" }
      - { id: I1o3, description: "Back-loaded timeline with deferred commitments" }
      - { id: I1o4, description: "Phased rollout with scheduled checkpoints" }
  - id: I2
    name: "Operating Economics"
    description: |
      How the lift-zone service will divide fees, revenue exposure, and operating risk.
    options:
      - { id: I2o1, description: "Milestone-based commitments released in stages" }
      - { id: I2o2, description: "Performance benchmarks with defined trigger points" }
      - { id: I2o3, description: "Front-loaded timeline with early commitments" }
      - { id: I2o4, description: "Phased rollout with scheduled checkpoints" }
  - id: I3
    name: "Oversight and Data Rules"
    description: |
      What audit, data, and transparency obligations govern the lift-zone service.
    options:
      - { id: I3o1, description: "Back-loaded timeline with deferred commitments" }
      - { id: I3o2, description: "Phased rollout with scheduled checkpoints" }
      - { id: I3o3, description: "Outcome-based design with measurable targets" }
      - { id: I3o4, description: "Periodic review with built-in adjustment windows" }
  - id: I4
    name: "Deployment Footprint"
    description: |
      Where and how broadly the lift-zone service will launch before any expansion.
    options:
      - { id: I4o1, description: "Front-loaded timeline with early commitments" }
      - { id: I4o2, description: "Pilot-first design with conditional expansion" }
      - { id: I4o3, description: "Performance benchmarks with defined trigger points" }
      - { id: I4o4, description: "Outcome-based design with measurable targets" }
  - id: I5
    name: "Community Access"
    description: |
      How neighborhoods receive benefits, recourse, and access from the lift-zone service.
    options:
      - { id: I5o1, description: "Back-loaded timeline with deferred commitments" }
      - { id: I5o2, description: "Modular structure of separable components" }
      - { id: I5o3, description: "Milestone-based commitments released in stages" }
      - { id: I5o4, description: "Pilot-first design with conditional expansion" }

agents:
  - id: skydrop
    agent_type: hard_bargainer
    min_threshold: 60
    goal_description: |
      You represent SkyDrop Logistics. You want a construction-material lift-zone pilot for constrained work sites approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
    priority_description: |
      Your top priority is I3o2 ("Phased rollout with scheduled checkpoints") on Oversight and Data Rules: it is worth clearly more to you than any other single option on the table.
      Your second priority is I5o2 ("Modular structure of separable components") on Community Access — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I1o3, I2o3, I4o1, but none of them is worth a war: workable alternatives there cost you only a modest amount.
    priority_narrative: |
      - Issue I1 (max score 10): I1o1(8), I1o2(3), I1o3(10), I1o4(0)
      - Issue I2 (max score 10): I2o1(2), I2o2(8), I2o3(10), I2o4(1)
      - Issue I3 (max score 43): I3o1(25), I3o2(43), I3o3(1), I3o4(0)
      - Issue I4 (max score 11): I4o1(11), I4o2(1), I4o3(0), I4o4(11)
      - Issue I5 (max score 26): I5o1(10), I5o2(26), I5o3(3), I5o4(0)
    issue_max_scores: { I1: 10, I2: 10, I3: 43, I4: 11, I5: 26 }
    scores:
      I1: { I1o1: 8, I1o2: 3, I1o3: 10, I1o4: 0 }
      I2: { I2o1: 2, I2o2: 8, I2o3: 10, I2o4: 1 }
      I3: { I3o1: 25, I3o2: 43, I3o3: 1, I3o4: 0 }
      I4: { I4o1: 11, I4o2: 1, I4o3: 0, I4o4: 11 }
      I5: { I5o1: 10, I5o2: 26, I5o3: 3, I5o4: 0 }
    preference_examples_about_others: |
      City Transport will press for public control, fiscal defensibility, and operational accountability. It has signaled that its single biggest prize is I3o4 ("Periodic review with built-in adjustment windows") on Oversight and Data Rules, and that it also strongly prefers I5o1 ("Back-loaded timeline with deferred commitments") on Community Access. Privacy Coalition will prioritize data limits, community safeguards, and cautious rollout. It has signaled that it cares most about I1o3 ("Back-loaded timeline with deferred commitments") on Environmental and Noise Controls, and that it also values I2o2 ("Performance benchmarks with defined trigger points") on Operating Economics. Couriers Guild will push for job protections, retraining, and worker recourse. It has signaled that it cares most about I4o1 ("Front-loaded timeline with early commitments") on Deployment Footprint, and that it also values I2o2 ("Performance benchmarks with defined trigger points") on Operating Economics. Aviation Safety will prioritize conservative operating envelopes, regulator visibility, and incident-response authority. It has signaled that it cares most about I2o4 ("Phased rollout with scheduled checkpoints") on Operating Economics, and that I3o1 ("Back-loaded timeline with deferred commitments") on Oversight and Data Rules is the direction it can support on that issue.

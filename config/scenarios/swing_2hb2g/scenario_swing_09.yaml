difficulty: hard

design:
  pool_options:
    I1: [I1o2, I1o3]
    I2: [I2o3, I2o4]
    I3: [I3o1, I3o3]
    I4: [I4o2, I4o4]
    I5: [I5o4]
  swing:
    seesaw_issue: I2
    swing_margin_band: [2, 8]
    comfort_min: 12
    hb_seesaw_favorite: { skydrop: I2o3, city_transport: I2o4 }
    swing_deal_counts: { skydrop: 6, city_transport: 4 }

project:
  name: "Emergency Payload Readiness Network"
  shared_description: |
    The parties are deciding whether to authorize an emergency-response payload network for storms and heat waves. The agreement must settle five issues governing the emergency payload service. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
    - id: skydrop
      display_name: "SkyDrop Logistics"
    - id: city_transport
      display_name: "Chicago Department of Transportation"
    - id: privacy_coalition
      display_name: "Digital Rights and Neighborhood Coalition"
    - id: couriers_guild
      display_name: "Chicago Couriers' Guild"
    - id: aviation_safety
      display_name: "Civil Aviation Safety Board"

issues:
  - id: I1
    name: "Deployment Footprint"
    description: |
      Where and how broadly the emergency payload service will launch before any expansion.
    options:
      - { id: I1o1, description: "Back-loaded timeline with deferred commitments" }
      - { id: I1o2, description: "Periodic review with built-in adjustment windows" }
      - { id: I1o3, description: "Phased rollout with scheduled checkpoints" }
      - { id: I1o4, description: "Standardized baseline terms with fixed criteria" }
  - id: I2
    name: "Safety Operating Envelope"
    description: |
      What operating constraints and safety checks apply while the emergency payload service runs.
    options:
      - { id: I2o1, description: "Periodic review with built-in adjustment windows" }
      - { id: I2o2, description: "Performance benchmarks with defined trigger points" }
      - { id: I2o3, description: "Phased rollout with scheduled checkpoints" }
      - { id: I2o4, description: "Back-loaded timeline with deferred commitments" }
  - id: I3
    name: "Oversight and Data Rules"
    description: |
      What audit, data, and transparency obligations govern the emergency payload service.
    options:
      - { id: I3o1, description: "Consolidated administration under unified terms" }
      - { id: I3o2, description: "Tiered requirements with graduated thresholds" }
      - { id: I3o3, description: "Phased rollout with scheduled checkpoints" }
      - { id: I3o4, description: "Back-loaded timeline with deferred commitments" }
  - id: I4
    name: "Workforce Transition"
    description: |
      How the emergency payload service handles labor standards, retraining, and affected workers.
    options:
      - { id: I4o1, description: "Modular structure of separable components" }
      - { id: I4o2, description: "Milestone-based commitments released in stages" }
      - { id: I4o3, description: "Front-loaded timeline with early commitments" }
      - { id: I4o4, description: "Pilot-first design with conditional expansion" }
  - id: I5
    name: "Operating Economics"
    description: |
      How the emergency payload service will divide fees, revenue exposure, and operating risk.
    options:
      - { id: I5o1, description: "Consolidated administration under unified terms" }
      - { id: I5o2, description: "Phased rollout with scheduled checkpoints" }
      - { id: I5o3, description: "Standardized baseline terms with fixed criteria" }
      - { id: I5o4, description: "Milestone-based commitments released in stages" }

agents:
  - id: skydrop
    agent_type: hard_bargainer
    min_threshold: 63
    goal_description: |
      You represent SkyDrop Logistics. You want an emergency-response payload network for storms and heat waves approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
    priority_description: |
      Your top priority is I5o2 ("Phased rollout with scheduled checkpoints") on Operating Economics: it is worth clearly more to you than any other single option on the table.
      Your second priority is I2o3 ("Phased rollout with scheduled checkpoints") on Safety Operating Envelope — smaller than your top priority, but still well worth pushing for.
      On the remaining issues your favorite options are I1o2, I3o3, I4o2, but none of them is worth a war: workable alternatives there cost you only a modest amount.
    priority_narrative: |
      - Issue I1 (max score 10): I1o1(3), I1o2(10), I1o3(10), I1o4(1)
      - Issue I2 (max score 26): I2o1(2), I2o2(3), I2o3(26), I2o4(11)
      - Issue I3 (max score 11): I3o1(10), I3o2(2), I3o3(11), I3o4(3)
      - Issue I4 (max score 13): I4o1(1), I4o2(13), I4o3(1), I4o4(12)
      - Issue I5 (max score 40): I5o1(1), I5o2(40), I5o3(3), I5o4(24)
    issue_max_scores: { I1: 10, I2: 26, I3: 11, I4: 13, I5: 40 }
    scores:
      I1: { I1o1: 3, I1o2: 10, I1o3: 10, I1o4: 1 }
      I2: { I2o1: 2, I2o2: 3, I2o3: 26, I2o4: 11 }
      I3: { I3o1: 10, I3o2: 2, I3o3: 11, I3o4: 3 }
      I4: { I4o1: 1, I4o2: 13, I4o3: 1, I4o4: 12 }
      I5: { I5o1: 1, I5o2: 40, I5o3: 3, I5o4: 24 }
    preference_examples_about_others: |
      City Transport will press for public control, fiscal defensibility, and operational accountability. It has signaled that its single biggest prize is I5o1 ("Consolidated administration under unified terms") on Operating Economics, and that it also strongly prefers I2o4 ("Back-loaded timeline with deferred commitments") on Safety Operating Envelope. Privacy Coalition will prioritize data limits, community safeguards, and cautious rollout. It has signaled that it cares most about I1o2 ("Periodic review with built-in adjustment windows") on Deployment Footprint, and that it also values I3o1 ("Consolidated administration under unified terms") on Oversight and Data Rules. Couriers Guild will push for job protections, retraining, and worker recourse. It has signaled that it cares most about I4o2 ("Milestone-based commitments released in stages") on Workforce Transition, and that it also values I3o1 ("Consolidated administration under unified terms") on Oversight and Data Rules. Aviation Safety will prioritize conservative operating envelopes, regulator visibility, and incident-response authority. It has signaled that it cares most about I4o1 ("Modular structure of separable components") on Workforce Transition, and that I5o4 ("Milestone-based commitments released in stages") on Operating Economics is the direction it can support on that issue.

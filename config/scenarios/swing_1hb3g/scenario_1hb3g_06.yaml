project:
  name: Stadium Event Logistics Grid
  shared_description: |
    The parties are deciding whether to authorize an event-day logistics grid around stadiums and venues. The agreement must settle five issues governing the event logistics. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
  - id: skydrop
    display_name: SkyDrop Logistics
  - id: city_transport
    display_name: Chicago Department of Transportation
  - id: privacy_coalition
    display_name: Digital Rights and Neighborhood Coalition
  - id: couriers_guild
    display_name: Chicago Couriers' Guild
  - id: aviation_safety
    display_name: Civil Aviation Safety Board
issues:
- id: I1
  name: Oversight and Data Rules
  description: |
    What audit, data, and transparency obligations govern the event logistics.
  options:
  - id: I1o1
    description: Phased rollout with scheduled checkpoints
  - id: I1o2
    description: Consolidated administration under unified terms
  - id: I1o3
    description: Milestone-based commitments released in stages
  - id: I1o4
    description: Back-loaded timeline with deferred commitments
- id: I2
  name: Community Access
  description: |
    How neighborhoods receive benefits, recourse, and access from the event logistics.
  options:
  - id: I2o1
    description: Phased rollout with scheduled checkpoints
  - id: I2o2
    description: Consolidated administration under unified terms
  - id: I2o3
    description: Modular structure of separable components
  - id: I2o4
    description: Back-loaded timeline with deferred commitments
- id: I3
  name: Environmental and Noise Controls
  description: |
    How the event logistics manages noise, emissions, and environmental accountability.
  options:
  - id: I3o1
    description: Back-loaded timeline with deferred commitments
  - id: I3o2
    description: Milestone-based commitments released in stages
  - id: I3o3
    description: Outcome-based design with measurable targets
  - id: I3o4
    description: Performance benchmarks with defined trigger points
- id: I4
  name: Workforce Transition
  description: |
    How the event logistics handles labor standards, retraining, and affected workers.
  options:
  - id: I4o1
    description: Performance benchmarks with defined trigger points
  - id: I4o2
    description: Modular structure of separable components
  - id: I4o3
    description: Consolidated administration under unified terms
  - id: I4o4
    description: Standardized baseline terms with fixed criteria
- id: I5
  name: Safety Operating Envelope
  description: |
    What operating constraints and safety checks apply while the event logistics runs.
  options:
  - id: I5o1
    description: Milestone-based commitments released in stages
  - id: I5o2
    description: Consolidated administration under unified terms
  - id: I5o3
    description: Outcome-based design with measurable targets
  - id: I5o4
    description: Front-loaded timeline with early commitments
agents:
- id: skydrop
  agent_type: hard_bargainer
  min_threshold: 65
  goal_description: |
    You represent SkyDrop Logistics. You want an event-day logistics grid around stadiums and venues approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
  priority_description: |-
    Your top priority is I1o4 ("Back-loaded timeline with deferred commitments") on Oversight and Data Rules; it is worth more to you than any other single issue on the table.
    Your second priority is I2o4 ("Back-loaded timeline with deferred commitments") on Community Access.
    On the remaining issues, your preferred options are I3o3, I4o4, I5o1, but you can consider workable alternatives.
  priority_narrative: |-
    - Issue I1 (max score 40): I1o1(0), I1o2(25), I1o3(0), I1o4(40)
    - Issue I2 (max score 24): I2o1(8), I2o2(0), I2o3(0), I2o4(24)
    - Issue I3 (max score 14): I3o1(6), I3o2(0), I3o3(14), I3o4(6)
    - Issue I4 (max score 11): I4o1(0), I4o2(9), I4o3(0), I4o4(11)
    - Issue I5 (max score 11): I5o1(11), I5o2(0), I5o3(0), I5o4(11)

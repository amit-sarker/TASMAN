project:
  name: Airport Compliance Sandbox
  shared_description: |
    The parties are deciding whether to authorize an airport-area compliance sandbox for regulated delivery operations. The agreement must settle five issues governing the airport sandbox. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
  - id: skydrop
    display_name: SkyDrop Logistics
  - id: city_transport
    display_name: Chicago Department of Transportation
  - id: privacy_coalition
    display_name: Digital Rights and Neighborhood Coalition
  - id: couriers_guild
    display_name: Chicago Couriers' Guild
  - id: aviation_safety
    display_name: Civil Aviation Safety Board
issues:
- id: I1
  name: Environmental and Noise Controls
  description: |
    How the airport sandbox manages noise, emissions, and environmental accountability.
  options:
  - id: I1o1
    description: Milestone-based commitments released in stages
  - id: I1o2
    description: Pilot-first design with conditional expansion
  - id: I1o3
    description: Front-loaded timeline with early commitments
  - id: I1o4
    description: Tiered requirements with graduated thresholds
- id: I2
  name: Workforce Transition
  description: |
    How the airport sandbox handles labor standards, retraining, and affected workers.
  options:
  - id: I2o1
    description: Front-loaded timeline with early commitments
  - id: I2o2
    description: Modular structure of separable components
  - id: I2o3
    description: Phased rollout with scheduled checkpoints
  - id: I2o4
    description: Consolidated administration under unified terms
- id: I3
  name: Community Access
  description: |
    How neighborhoods receive benefits, recourse, and access from the airport sandbox.
  options:
  - id: I3o1
    description: Consolidated administration under unified terms
  - id: I3o2
    description: Front-loaded timeline with early commitments
  - id: I3o3
    description: Tiered requirements with graduated thresholds
  - id: I3o4
    description: Back-loaded timeline with deferred commitments
- id: I4
  name: Deployment Footprint
  description: |
    Where and how broadly the airport sandbox will launch before any expansion.
  options:
  - id: I4o1
    description: Performance benchmarks with defined trigger points
  - id: I4o2
    description: Phased rollout with scheduled checkpoints
  - id: I4o3
    description: Outcome-based design with measurable targets
  - id: I4o4
    description: Periodic review with built-in adjustment windows
- id: I5
  name: Safety Operating Envelope
  description: |
    What operating constraints and safety checks apply while the airport sandbox runs.
  options:
  - id: I5o1
    description: Tiered requirements with graduated thresholds
  - id: I5o2
    description: Outcome-based design with measurable targets
  - id: I5o3
    description: Periodic review with built-in adjustment windows
  - id: I5o4
    description: Pilot-first design with conditional expansion

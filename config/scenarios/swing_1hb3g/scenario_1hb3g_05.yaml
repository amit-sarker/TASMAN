- id: skydrop
  agent_type: hard_bargainer
  min_threshold: 65
  goal_description: |
    You represent SkyDrop Logistics. You want an overnight low-noise delivery pilot for dense districts approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
  priority_description: |-
    Your top priority is I5o2 ("Milestone-based commitments released in stages") on Operating Economics; it is worth more to you than any other single issue on the table.
    Your second priority is I1o1 ("Phased rollout with scheduled checkpoints") on Safety Operating Envelope.
    On the remaining issues, your preferred options are I2o2, I3o4, I4o2, but you can consider workable alternatives.
  priority_narrative: |-
    - Issue I1 (max score 24): I1o1(24), I1o2(0), I1o3(8), I1o4(0)
    - Issue I2 (max score 14): I2o1(0), I2o2(14), I2o3(6), I2o4(6)

project:
  name: Transit Parcel Exchange
  shared_description: |
    The parties are deciding whether to authorize a transit-station parcel exchange tied to bus and rail nodes. The agreement must settle five issues governing the station exchange points. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
  - id: skydrop
    display_name: SkyDrop Logistics
  - id: city_transport
    display_name: Chicago Department of Transportation
  - id: privacy_coalition
    display_name: Digital Rights and Neighborhood Coalition
  - id: couriers_guild
    display_name: Chicago Couriers' Guild
  - id: aviation_safety
    display_name: Civil Aviation Safety Board
issues:
- id: I1
  name: Safety Operating Envelope
  description: |
    What operating constraints and safety checks apply while the station exchange points runs.
  options:
  - id: I1o1
    description: Outcome-based design with measurable targets
  - id: I1o2
    description: Back-loaded timeline with deferred commitments
  - id: I1o3
    description: Standardized baseline terms with fixed criteria
  - id: I1o4
    description: Modular structure of separable components
- id: I2
  name: Deployment Footprint
  description: |
    Where and how broadly the station exchange points will launch before any expansion.
  options:
  - id: I2o1
    description: Performance benchmarks with defined trigger points
  - id: I2o2
    description: Front-loaded timeline with early commitments
  - id: I2o3
    description: Periodic review with built-in adjustment windows
  - id: I2o4
    description: Modular structure of separable components
- id: I3
  name: Community Access
  description: |
    How neighborhoods receive benefits, recourse, and access from the station exchange points.
  options:
  - id: I3o1
    description: Consolidated administration under unified terms
  - id: I3o2
    description: Standardized baseline terms with fixed criteria
  - id: I3o3
    description: Pilot-first design with conditional expansion
  - id: I3o4
    description: Periodic review with built-in adjustment windows
- id: I4
  name: Workforce Transition
  description: |
    How the station exchange points handles labor standards, retraining, and affected workers.
  options:
  - id: I4o1
    description: Front-loaded timeline with early commitments
  - id: I4o2
    description: Outcome-based design with measurable targets
  - id: I4o3
    description: Performance benchmarks with defined trigger points
  - id: I4o4
    description: Tiered requirements with graduated thresholds
- id: I5
  name: Environmental and Noise Controls
  description: |
    How the station exchange points manages noise, emissions, and environmental accountability.
  options:
  - id: I5o1
    description: Modular structure of separable components
  - id: I5o2
    description: Phased rollout with scheduled checkpoints
  - id: I5o3
    description: Standardized baseline terms with fixed criteria
  - id: I5o4
    description: Outcome-based design with measurable targets
agents:
- id: skydrop
  agent_type: hard_bargainer
  min_threshold: 65
  goal_description: |
    You represent SkyDrop Logistics. You want a transit-station parcel exchange tied to bus and rail nodes approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
  priority_description: |-
    Your top priority is I2o4 ("Modular structure of separable components") on Deployment Footprint; it is worth more to you than any other single issue on the table.
    Your second priority is I3o2 ("Standardized baseline terms with fixed criteria") on Community Access.
    On the remaining issues, your preferred options are I1o1, I4o3, I5o1, but you can consider workable alternatives.
  priority_narrative: |-
    - Issue I1 (max score 11): I1o1(11), I1o2(0), I1o3(11), I1o4(0)
    - Issue I2 (max score 40): I2o1(0), I2o2(25), I2o3(0), I2o4(40)
    - Issue I3 (max score 24): I3o1(0), I3o2(24), I3o3(8), I3o4(0)

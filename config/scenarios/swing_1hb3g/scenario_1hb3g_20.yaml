project:
  name: Brownfield Depot Conversion
  shared_description: |
    The parties are deciding whether to authorize a brownfield depot conversion for clean neighborhood logistics. The agreement must settle five issues governing the depot conversion. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
  - id: skydrop
    display_name: SkyDrop Logistics
  - id: city_transport
    display_name: Chicago Department of Transportation
  - id: privacy_coalition
    display_name: Digital Rights and Neighborhood Coalition
  - id: couriers_guild
    display_name: Chicago Couriers' Guild
  - id: aviation_safety
    display_name: Civil Aviation Safety Board
issues:
- id: I1
  name: Workforce Transition
  description: |
    How the depot conversion handles labor standards, retraining, and affected workers.
  options:
  - id: I1o1
    description: Front-loaded timeline with early commitments
  - id: I1o2
    description: Back-loaded timeline with deferred commitments
  - id: I1o3
    description: Outcome-based design with measurable targets
  - id: I1o4
    description: Standardized baseline terms with fixed criteria
- id: I2
  name: Community Access
  description: |
    How neighborhoods receive benefits, recourse, and access from the depot conversion.
  options:
  - id: I2o1
    description: Phased rollout with scheduled checkpoints
  - id: I2o2
    description: Back-loaded timeline with deferred commitments
  - id: I2o3
    description: Periodic review with built-in adjustment windows
  - id: I2o4
    description: Front-loaded timeline with early commitments
- id: I3
  name: Oversight and Data Rules
  description: |
    What audit, data, and transparency obligations govern the depot conversion.
  options:
  - id: I3o1
    description: Phased rollout with scheduled checkpoints
  - id: I3o2
    description: Milestone-based commitments released in stages
  - id: I3o3
    description: Back-loaded timeline with deferred commitments
  - id: I3o4
    description: Front-loaded timeline with early commitments
- id: I4
  name: Safety Operating Envelope
  description: |
    What operating constraints and safety checks apply while the depot conversion runs.
  options:
  - id: I4o1
    description: Outcome-based design with measurable targets
  - id: I4o2
    description: Front-loaded timeline with early commitments
  - id: I4o3
    description: Periodic review with built-in adjustment windows
  - id: I4o4
    description: Modular structure of separable components
- id: I5
  name: Deployment Footprint
  description: |
    Where and how broadly the depot conversion will launch before any expansion.
  options:
  - id: I5o1
    description: Modular structure of separable components
  - id: I5o2
    description: Pilot-first design with conditional expansion
  - id: I5o3
    description: Standardized baseline terms with fixed criteria
  - id: I5o4
    description: Front-loaded timeline with early commitments
agents:
- id: skydrop
  agent_type: hard_bargainer
  min_threshold: 65
  goal_description: |
    You represent SkyDrop Logistics. You want a brownfield depot conversion for clean neighborhood logistics approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
  priority_description: |-
    Your top priority is I5o4 ("Front-loaded timeline with early commitments") on Deployment Footprint; it is worth more to you than any other single issue on the table.
    Your second priority is I1o1 ("Front-loaded timeline with early commitments") on Workforce Transition.
    On the remaining issues, your preferred options are I2o2, I3o2, I4o1, but you can consider workable alternatives.
  priority_narrative: |-
    - Issue I1 (max score 24): I1o1(24), I1o2(0), I1o3(8), I1o4(0)
    - Issue I2 (max score 14): I2o1(6), I2o2(14), I2o3(6), I2o4(0)
    - Issue I3 (max score 11): I3o1(9), I3o2(11), I3o3(0), I3o4(0)

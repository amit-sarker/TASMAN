- id: skydrop
  agent_type: hard_bargainer
  min_threshold: 65
  goal_description: |
    You represent SkyDrop Logistics. You want a university-district logistics grid for labs, dorms, and vendors approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
  priority_description: |-
    Your top priority is I4o1 ("Performance benchmarks with defined trigger points") on Community Access; it is worth more to you than any other single issue on the table.
    Your second priority is I5o1 ("Modular structure of separable components") on Oversight and Data Rules.
    On the remaining issues, your preferred options are I1o2, I2o4, I3o1, but you can consider workable alternatives.

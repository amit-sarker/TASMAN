- id: skydrop
  agent_type: hard_bargainer
  min_threshold: 65
  goal_description: |
    You represent SkyDrop Logistics. You want a curbside freight microhub permit program approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
  priority_description: |-
    Your top priority is I1o3 ("Outcome-based design with measurable targets") on Community Access; it is worth more to you than any other single issue on the table.
    Your second priority is I2o1 ("Pilot-first design with conditional expansion") on Workforce Transition.
    On the remaining issues, your preferred options are I3o4, I4o3, I5o3, but you can consider workable alternatives.
  priority_narrative: |-
    - Issue I1 (max score 40): I1o1(25), I1o2(0), I1o3(40), I1o4(0)
    - Issue I2 (max score 24): I2o1(24), I2o2(0), I2o3(8), I2o4(0)
    - Issue I3 (max score 14): I3o1(0), I3o2(6), I3o3(6), I3o4(14)

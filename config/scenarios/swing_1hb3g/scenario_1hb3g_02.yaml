- id: skydrop
  agent_type: hard_bargainer
  min_threshold: 65
  goal_description: |
    You represent SkyDrop Logistics. You want a network of automated parcel lockers near transit stops approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
  priority_description: |-
    Your top priority is I2o4 ("Phased rollout with scheduled checkpoints") on Deployment Footprint; it is worth more to you than any other single issue on the table.
    Your second priority is I3o2 ("Consolidated administration under unified terms") on Community Access.
    On the remaining issues, your preferred options are I1o1, I4o1, I5o2, but you can consider workable alternatives.
  priority_narrative: |-
    - Issue I1 (max score 11): I1o1(11), I1o2(0), I1o3(0), I1o4(11)
    - Issue I2 (max score 40): I2o1(0), I2o2(25), I2o3(0), I2o4(40)

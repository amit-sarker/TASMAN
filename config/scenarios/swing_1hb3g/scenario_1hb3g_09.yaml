project:
  name: Emergency Payload Readiness Network
  shared_description: |
    The parties are deciding whether to authorize an emergency-response payload network for storms and heat waves. The agreement must settle five issues governing the emergency payload service. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
  - id: skydrop
    display_name: SkyDrop Logistics
  - id: city_transport
    display_name: Chicago Department of Transportation
  - id: privacy_coalition
    display_name: Digital Rights and Neighborhood Coalition
  - id: couriers_guild
    display_name: Chicago Couriers' Guild
  - id: aviation_safety
    display_name: Civil Aviation Safety Board
issues:
- id: I1
  name: Deployment Footprint
  description: |
    Where and how broadly the emergency payload service will launch before any expansion.
  options:
  - id: I1o1
    description: Back-loaded timeline with deferred commitments
  - id: I1o2
    description: Periodic review with built-in adjustment windows
  - id: I1o3
    description: Phased rollout with scheduled checkpoints
  - id: I1o4
    description: Standardized baseline terms with fixed criteria
- id: I2
  name: Safety Operating Envelope
  description: |
    What operating constraints and safety checks apply while the emergency payload service runs.
  options:
  - id: I2o1
    description: Periodic review with built-in adjustment windows
  - id: I2o2
    description: Performance benchmarks with defined trigger points
  - id: I2o3
    description: Phased rollout with scheduled checkpoints
  - id: I2o4
    description: Back-loaded timeline with deferred commitments
- id: I3
  name: Oversight and Data Rules
  description: |
    What audit, data, and transparency obligations govern the emergency payload service.
  options:
  - id: I3o1
    description: Consolidated administration under unified terms
  - id: I3o2
    description: Tiered requirements with graduated thresholds
  - id: I3o3
    description: Phased rollout with scheduled checkpoints
  - id: I3o4
    description: Back-loaded timeline with deferred commitments
- id: I4
  name: Workforce Transition
  description: |
    How the emergency payload service handles labor standards, retraining, and affected workers.
  options:
  - id: I4o1
    description: Modular structure of separable components
  - id: I4o2
    description: Milestone-based commitments released in stages
  - id: I4o3
    description: Front-loaded timeline with early commitments
  - id: I4o4
    description: Pilot-first design with conditional expansion
- id: I5
  name: Operating Economics
  description: |
    How the emergency payload service will divide fees, revenue exposure, and operating risk.
  options:
  - id: I5o1
    description: Consolidated administration under unified terms
  - id: I5o2
    description: Phased rollout with scheduled checkpoints
  - id: I5o3
    description: Standardized baseline terms with fixed criteria
  - id: I5o4
    description: Milestone-based commitments released in stages
agents:
- id: skydrop
  agent_type: hard_bargainer
  min_threshold: 65
  goal_description: |
    You represent SkyDrop Logistics. You want an emergency-response payload network for storms and heat waves approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
  priority_description: |-
    Your top priority is I4o4 ("Pilot-first design with conditional expansion") on Workforce Transition; it is worth more to you than any other single issue on the table.
    Your second priority is I5o1 ("Consolidated administration under unified terms") on Operating Economics.
    On the remaining issues, your preferred options are I1o3, I2o4, I3o2, but you can consider workable alternatives.
  priority_narrative: |-
    - Issue I1 (max score 14): I1o1(0), I1o2(6), I1o3(14), I1o4(6)
    - Issue I2 (max score 11): I2o1(0), I2o2(9), I2o3(0), I2o4(11)
    - Issue I3 (max score 11): I3o1(0), I3o2(11), I3o3(0), I3o4(11)
    - Issue I4 (max score 40): I4o1(0), I4o2(25), I4o3(0), I4o4(40)
    - Issue I5 (max score 24): I5o1(24), I5o2(0), I5o3(0), I5o4(8)

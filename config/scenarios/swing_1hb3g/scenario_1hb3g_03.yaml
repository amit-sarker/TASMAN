project:
  name: Medical Drone Corridor
  shared_description: |
    The parties are deciding whether to authorize a medical supply drone corridor connecting clinics and labs. The agreement must settle five issues governing the medical payload routes. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
  - id: skydrop
    display_name: SkyDrop Logistics
  - id: city_transport
    display_name: Chicago Department of Transportation
  - id: privacy_coalition
    display_name: Digital Rights and Neighborhood Coalition
  - id: couriers_guild
    display_name: Chicago Couriers' Guild
  - id: aviation_safety
    display_name: Civil Aviation Safety Board
issues:
- id: I1
  name: Oversight and Data Rules
  description: |
    What audit, data, and transparency obligations govern the medical payload routes.
  options:
  - id: I1o1
    description: Milestone-based commitments released in stages
  - id: I1o2
    description: Periodic review with built-in adjustment windows
  - id: I1o3
    description: Standardized baseline terms with fixed criteria
  - id: I1o4
    description: Performance benchmarks with defined trigger points
- id: I2
  name: Safety Operating Envelope
  description: |
    What operating constraints and safety checks apply while the medical payload routes runs.
  options:
  - id: I2o1
    description: Modular structure of separable components
  - id: I2o2
    description: Phased rollout with scheduled checkpoints
  - id: I2o3
    description: Consolidated administration under unified terms
  - id: I2o4
    description: Performance benchmarks with defined trigger points
- id: I3
  name: Deployment Footprint
  description: |
    Where and how broadly the medical payload routes will launch before any expansion.
  options:
  - id: I3o1
    description: Milestone-based commitments released in stages
  - id: I3o2
    description: Tiered requirements with graduated thresholds
  - id: I3o3
    description: Front-loaded timeline with early commitments
  - id: I3o4
    description: Standardized baseline terms with fixed criteria
- id: I4
  name: Community Access
  description: |
    How neighborhoods receive benefits, recourse, and access from the medical payload routes.
  options:
  - id: I4o1
    description: Outcome-based design with measurable targets
  - id: I4o2
    description: Phased rollout with scheduled checkpoints
  - id: I4o3
    description: Consolidated administration under unified terms
  - id: I4o4
    description: Front-loaded timeline with early commitments
- id: I5
  name: Environmental and Noise Controls
  description: |
    How the medical payload routes manages noise, emissions, and environmental accountability.
  options:
  - id: I5o1
    description: Outcome-based design with measurable targets
  - id: I5o2
    description: Performance benchmarks with defined trigger points
  - id: I5o3
    description: Front-loaded timeline with early commitments
  - id: I5o4
    description: Consolidated administration under unified terms

- id: skydrop
  agent_type: hard_bargainer
  min_threshold: 65
  goal_description: |
    You represent SkyDrop Logistics. You want a medical supply drone corridor connecting clinics and labs approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
  priority_description: |-
    Your top priority is I3o3 ("Front-loaded timeline with early commitments") on Deployment Footprint; it is worth more to you than any other single issue on the table.
    Your second priority is I4o4 ("Front-loaded timeline with early commitments") on Community Access.
    On the remaining issues, your preferred options are I1o2, I2o2, I5o1, but you can consider workable alternatives.

  priority_description: |-
    Your top priority is I4o1 ("Tiered requirements with graduated thresholds") on Operating Economics; it is worth more to you than any other single issue on the table.
    Your second priority is I5o1 ("Consolidated administration under unified terms") on Safety Operating Envelope.
    On the remaining issues, your preferred options are I1o1, I2o3, I3o2, but you can consider workable alternatives.
  priority_narrative: |-
    - Issue I1 (max score 14): I1o1(14), I1o2(0), I1o3(6), I1o4(6)
    - Issue I2 (max score 11): I2o1(0), I2o2(9), I2o3(11), I2o4(0)

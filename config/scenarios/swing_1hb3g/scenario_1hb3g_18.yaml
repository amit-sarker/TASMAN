project:
  name: Lakefront Service Route
  shared_description: |
    The parties are deciding whether to authorize a lakefront park service route for maintenance and visitor support. The agreement must settle five issues governing the lakefront service. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
  - id: skydrop
    display_name: SkyDrop Logistics
  - id: city_transport
    display_name: Chicago Department of Transportation
  - id: privacy_coalition
    display_name: Digital Rights and Neighborhood Coalition
  - id: couriers_guild
    display_name: Chicago Couriers' Guild
  - id: aviation_safety
    display_name: Civil Aviation Safety Board
issues:
- id: I1
  name: Workforce Transition
  description: |
    How the lakefront service handles labor standards, retraining, and affected workers.
  options:
  - id: I1o1
    description: Periodic review with built-in adjustment windows
  - id: I1o2
    description: Front-loaded timeline with early commitments
  - id: I1o3
    description: Performance benchmarks with defined trigger points
  - id: I1o4
    description: Modular structure of separable components
- id: I2
  name: Oversight and Data Rules
  description: |
    What audit, data, and transparency obligations govern the lakefront service.
  options:
  - id: I2o1
    description: Phased rollout with scheduled checkpoints
  - id: I2o2
    description: Consolidated administration under unified terms
  - id: I2o3
    description: Standardized baseline terms with fixed criteria
  - id: I2o4
    description: Tiered requirements with graduated thresholds
- id: I3
  name: Operating Economics
  description: |
    How the lakefront service will divide fees, revenue exposure, and operating risk.
  options:
  - id: I3o1
    description: Phased rollout with scheduled checkpoints
  - id: I3o2
    description: Back-loaded timeline with deferred commitments
  - id: I3o3
    description: Milestone-based commitments released in stages
  - id: I3o4
    description: Periodic review with built-in adjustment windows
- id: I4
  name: Deployment Footprint
  description: |
    Where and how broadly the lakefront service will launch before any expansion.
  options:
  - id: I4o1
    description: Front-loaded timeline with early commitments
  - id: I4o2
    description: Tiered requirements with graduated thresholds
  - id: I4o3
    description: Phased rollout with scheduled checkpoints
  - id: I4o4
    description: Periodic review with built-in adjustment windows
- id: I5
  name: Safety Operating Envelope
  description: |
    What operating constraints and safety checks apply while the lakefront service runs.
  options:
  - id: I5o1
    description: Periodic review with built-in adjustment windows
  - id: I5o2
    description: Performance benchmarks with defined trigger points
  - id: I5o3
    description: Back-loaded timeline with deferred commitments
  - id: I5o4
    description: Outcome-based design with measurable targets
agents:
- id: skydrop
  agent_type: hard_bargainer
  min_threshold: 65
  goal_description: |
    You represent SkyDrop Logistics. You want a lakefront park service route for maintenance and visitor support approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
  priority_description: |-
    Your top priority is I3o3 ("Milestone-based commitments released in stages") on Operating Economics; it is worth more to you than any other single issue on the table.
    Your second priority is I4o4 ("Periodic review with built-in adjustment windows") on Deployment Footprint.
    On the remaining issues, your preferred options are I1o1, I2o3, I5o1, but you can consider workable alternatives.
  priority_narrative: |-
    - Issue I1 (max score 11): I1o1(11), I1o2(0), I1o3(0), I1o4(9)
    - Issue I2 (max score 11): I2o1(0), I2o2(0), I2o3(11), I2o4(11)
    - Issue I3 (max score 40): I3o1(0), I3o2(25), I3o3(40), I3o4(0)
    - Issue I4 (max score 24): I4o1(8), I4o2(0), I4o3(0), I4o4(24)
    - Issue I5 (max score 14): I5o1(14), I5o2(0), I5o3(6), I5o4(6)

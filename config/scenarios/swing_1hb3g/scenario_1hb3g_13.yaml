project:
  name: Construction Lift Zone Pilot
  shared_description: |
    The parties are deciding whether to authorize a construction-material lift-zone pilot for constrained work sites. The agreement must settle five issues governing the lift-zone service. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
  - id: skydrop
    display_name: SkyDrop Logistics
  - id: city_transport
    display_name: Chicago Department of Transportation
  - id: privacy_coalition
    display_name: Digital Rights and Neighborhood Coalition
  - id: couriers_guild
    display_name: Chicago Couriers' Guild
  - id: aviation_safety
    display_name: Civil Aviation Safety Board
issues:
- id: I1
  name: Environmental and Noise Controls
  description: |
    How the lift-zone service manages noise, emissions, and environmental accountability.
  options:
  - id: I1o1
    description: Outcome-based design with measurable targets
  - id: I1o2
    description: Pilot-first design with conditional expansion
  - id: I1o3
    description: Back-loaded timeline with deferred commitments
  - id: I1o4
    description: Phased rollout with scheduled checkpoints
- id: I2
  name: Operating Economics
  description: |
    How the lift-zone service will divide fees, revenue exposure, and operating risk.
  options:
  - id: I2o1
    description: Milestone-based commitments released in stages
  - id: I2o2
    description: Performance benchmarks with defined trigger points
  - id: I2o3
    description: Front-loaded timeline with early commitments
  - id: I2o4
    description: Phased rollout with scheduled checkpoints
- id: I3
  name: Oversight and Data Rules
  description: |
    What audit, data, and transparency obligations govern the lift-zone service.
  options:
  - id: I3o1
    description: Back-loaded timeline with deferred commitments
  - id: I3o2
    description: Phased rollout with scheduled checkpoints
  - id: I3o3
    description: Outcome-based design with measurable targets
  - id: I3o4
    description: Periodic review with built-in adjustment windows
- id: I4
  name: Deployment Footprint
  description: |
    Where and how broadly the lift-zone service will launch before any expansion.
  options:
  - id: I4o1
    description: Front-loaded timeline with early commitments
  - id: I4o2
    description: Pilot-first design with conditional expansion
  - id: I4o3
    description: Performance benchmarks with defined trigger points
  - id: I4o4
    description: Outcome-based design with measurable targets
- id: I5
  name: Community Access
  description: |
    How neighborhoods receive benefits, recourse, and access from the lift-zone service.
  options:
  - id: I5o1
    description: Back-loaded timeline with deferred commitments
  - id: I5o2
    description: Modular structure of separable components
  - id: I5o3
    description: Milestone-based commitments released in stages
  - id: I5o4
    description: Pilot-first design with conditional expansion

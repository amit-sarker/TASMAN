project:
  name: Riverfront Consolidation Depot
  shared_description: |
    The parties are deciding whether to authorize a riverfront depot for consolidated last-mile deliveries. The agreement must settle five issues governing the depot operations. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
  - id: skydrop
    display_name: SkyDrop Logistics
  - id: city_transport
    display_name: Chicago Department of Transportation
  - id: privacy_coalition
    display_name: Digital Rights and Neighborhood Coalition
  - id: couriers_guild
    display_name: Chicago Couriers' Guild
  - id: aviation_safety
    display_name: Civil Aviation Safety Board
issues:
- id: I1
  name: Oversight and Data Rules
  description: |
    What audit, data, and transparency obligations govern the depot operations.
  options:
  - id: I1o1
    description: Periodic review with built-in adjustment windows
  - id: I1o2
    description: Consolidated administration under unified terms
  - id: I1o3
    description: Standardized baseline terms with fixed criteria
  - id: I1o4
    description: Front-loaded timeline with early commitments
- id: I2
  name: Workforce Transition
  description: |
    How the depot operations handles labor standards, retraining, and affected workers.
  options:
  - id: I2o1
    description: Milestone-based commitments released in stages
  - id: I2o2
    description: Pilot-first design with conditional expansion
  - id: I2o3
    description: Tiered requirements with graduated thresholds
  - id: I2o4
    description: Standardized baseline terms with fixed criteria
- id: I3
  name: Community Access
  description: |
    How neighborhoods receive benefits, recourse, and access from the depot operations.
  options:
  - id: I3o1
    description: Performance benchmarks with defined trigger points
  - id: I3o2
    description: Outcome-based design with measurable targets
  - id: I3o3
    description: Tiered requirements with graduated thresholds
  - id: I3o4
    description: Phased rollout with scheduled checkpoints
- id: I4
  name: Deployment Footprint
  description: |
    Where and how broadly the depot operations will launch before any expansion.
  options:
  - id: I4o1
    description: Milestone-based commitments released in stages
  - id: I4o2
    description: Back-loaded timeline with deferred commitments
  - id: I4o3
    description: Modular structure of separable components
  - id: I4o4
    description: Periodic review with built-in adjustment windows
- id: I5
  name: Environmental and Noise Controls
  description: |
    How the depot operations manages noise, emissions, and environmental accountability.
  options:
  - id: I5o1
    description: Phased rollout with scheduled checkpoints
  - id: I5o2
    description: Pilot-first design with conditional expansion
  - id: I5o3
    description: Periodic review with built-in adjustment windows
  - id: I5o4
    description: Standardized baseline terms with fixed criteria
agents:
- id: skydrop
  agent_type: hard_bargainer
  min_threshold: 65
  goal_description: |
    You represent SkyDrop Logistics. You want a riverfront depot for consolidated last-mile deliveries approved on terms that keep the service commercially workable, operationally flexible, and scalable enough to justify investment.
  priority_description: |-
    Your top priority is I4o2 ("Back-loaded timeline with deferred commitments") on Deployment Footprint; it is worth more to you than any other single issue on the table.
    Your second priority is I5o3 ("Periodic review with built-in adjustment windows") on Environmental and Noise Controls.
    On the remaining issues, your preferred options are I1o2, I2o1, I3o1, but you can consider workable alternatives.
  priority_narrative: |-
    - Issue I1 (max score 14): I1o1(6), I1o2(14), I1o3(6), I1o4(0)
    - Issue I2 (max score 11): I2o1(11), I2o2(9), I2o3(0), I2o4(0)
    - Issue I3 (max score 11): I3o1(11), I3o2(0), I3o3(0), I3o4(11)

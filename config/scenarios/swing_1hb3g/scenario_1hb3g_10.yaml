project:
  name: Downtown Rooftop Pad Program
  shared_description: |
    The parties are deciding whether to authorize a downtown rooftop landing-pad program for parcel transfer. The agreement must settle five issues governing the rooftop pads. Each party has private tradeoffs and its own preferred package, so a viable agreement requires a narrow coalition around one of the few compromise packages that give every party enough to say yes.
  parties:
  - id: skydrop
    display_name: SkyDrop Logistics
  - id: city_transport
    display_name: Chicago Department of Transportation
  - id: privacy_coalition
    display_name: Digital Rights and Neighborhood Coalition
  - id: couriers_guild
    display_name: Chicago Couriers' Guild
  - id: aviation_safety
    display_name: Civil Aviation Safety Board
issues:
- id: I1
  name: Community Access
  description: |
    How neighborhoods receive benefits, recourse, and access from the rooftop pads.
  options:
  - id: I1o1
    description: Tiered requirements with graduated thresholds
  - id: I1o2
    description: Front-loaded timeline with early commitments
  - id: I1o3
    description: Outcome-based design with measurable targets
  - id: I1o4
    description: Milestone-based commitments released in stages
- id: I2
  name: Deployment Footprint
  description: |
    Where and how broadly the rooftop pads will launch before any expansion.
  options:
  - id: I2o1
    description: Milestone-based commitments released in stages
  - id: I2o2
    description: Consolidated administration under unified terms
  - id: I2o3
    description: Tiered requirements with graduated thresholds
  - id: I2o4
    description: Standardized baseline terms with fixed criteria
- id: I3
  name: Operating Economics
  description: |
    How the rooftop pads will divide fees, revenue exposure, and operating risk.
  options:
  - id: I3o1
    description: Pilot-first design with conditional expansion
  - id: I3o2
    description: Tiered requirements with graduated thresholds
  - id: I3o3
    description: Phased rollout with scheduled checkpoints
  - id: I3o4
    description: Milestone-based commitments released in stages
- id: I4
  name: Safety Operating Envelope
  description: |
    What operating constraints and safety checks apply while the rooftop pads runs.
  options:
  - id: I4o1
    description: Phased rollout with scheduled checkpoints
  - id: I4o2
    description: Modular structure of separable components
  - id: I4o3
    description: Consolidated administration under unified terms
  - id: I4o4
    description: Pilot-first design with conditional expansion
- id: I5
  name: Oversight and Data Rules
  description: |
    What audit, data, and transparency obligations govern the rooftop pads.
  options:
  - id: I5o1
    description: Front-loaded timeline with early commitments
  - id: I5o2
    description: Standardized baseline terms with fixed criteria
  - id: I5o3
    description: Modular structure of separable components
  - id: I5o4
    description: Outcome-based design with measurable targets
